ento para que las ordenen y expliquen el relato basándose en ellas. Si el discente las ordenara de forma equivocada, no es el docente el que debe corregir al niño, sino que debería ser el propio niño el que, al relatar, se diera cuenta de su error.</p><p>3. DISCUSIÓN</p><p>Los estudios empíricos derivados del modelo de Gough y Tunmer (1986), denominado Visión Simple de la Lectura, han probado que, en la lectura, existen dos grandes componentes: la descodificación y la comprensión. La descodificación depende, fundamentalmente, del conocimiento alfabético y la comprensión; en cambio, está muy vinculada a las habilidades lingüísticas orales. No parece lógico, por tanto, que en las aulas de Educación Infantil se dé prioridad a la mecanización de los procesos de descodificación cuando se ha comprobado que el desarrollo exitoso de las habilidades de comprensión lectora también está estrechamente vinculado a la adquisición de estrategias de interacción con el texto.</p><p>166 166</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Después de la lectura</h3>\n    <p>La sección muestra qué ocurre después de leer. Cumple una función didáctica importante en el artículo, pero para mi concepto de lectura compartida la leo como extensión de la mediación, no como núcleo definitorio.</p>\n    <div class=\"bigPrompt\">Completar la secuencia</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Después de la lectura", "stage": "Fuente 1 · p. 166", "desc": "Completar la secuencia.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 166 · pantalla 2/2", "page": "p. 166", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">166</span>\n    <div class=\"paperText\"><p>La implementación de secuencias como la que hemos descrito ofrece a los niños numerosas oportunidades de empezar a aprender a ser buenos lectores, es decir: lectores activos; lectores que tienen en mente propósitos de lectura y que constantemente evalúan si con la lectura los están alcanzando; que están acostumbrados a sobrevolar el texto para apreciar su estructura; que realizan predicciones antes y durante la lectura; que leen selectivamente, tomando decisiones sobre lo que tienen que leer más detenidamente o más deprisa, sobre lo que pueden obviar; que cuestionan, construyen y revisan el significado de lo que leen; que movilizan su bagaje previo de conocimientos y lo integran, comparándolo, con los significados del texto; que monitorizan su proceso de comprensión, haciendo ajustes cuando es necesario; que leen los diferentes tipos de texto de forma distinta, y que desarrollan los procesos de comprensión antes, durante y después de la lectura (Duke y Pearson, 2002).</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Después de la lectura</h3>\n    <p>La sección muestra qué ocurre después de leer. Cumple una función didáctica importante en el artículo, pero para mi concepto de lectura compartida la leo como extensión de la mediación, no como núcleo definitorio.</p>\n    <div class=\"bigPrompt\">Completar la secuencia</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Discusión", "stage": "Fuente 1 · p. 167", "desc": "Volver a ideas de mayor nivel.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 167 · pantalla 1/2", "page": "p. 167", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">167</span>\n    <div class=\"paperText\"><p>Ahora bien, tal y como señala Bus (2002), uno de los factores clave a la hora de desarrollar una sesión de lectura compartida de «alta calidad» es la manera en que el adulto medie para responder a los intereses, expe­ riencias, concepciones y conocimientos de los niños. Por eso, hemos tratado de ilustrar cómo desarrollar este tipo de situaciones con un comportamiento interactivo eficaz que incluya clarificación de la información, focalización en las ilustraciones y en los elementos textuales, explicación de vocabulario, modelado y andamiaje de estrategias y conexión con las experiencias vitales (Morrow, O’Connor y Smith, 1990; Klesius y Griffith, 1996).</p><p>Los patrones interactivos desarrollados en las sesiones de lectura conjunta han sido estudiados desde distintos ángulos: así, por ejemplo, se ha valorado cómo varían cuando los niños parecen presentar retrasos en el desarrollo del lenguaje (Justice y Kanderavek, 2003) y se ha identificado qué tipo de preguntas se formulan en relación con la adquisición de nuevo vocabulario (Blewitt, Rump, Shealy y Cook, 2009). Sin embargo, no existen apenas estudios empíricos que hayan explorado la relación entre las interac­ ciones que se producen durante la lectura dialógica y el desarrollo, en los aprendices, de las estrategias de lectura. Con este trabajo hemos pretendido ofrecer una herramienta, la secuencia didáctica, que creemos puede abrir camino.</p><p>167 167</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Aquí bajo la velocidad</span></div></div>\n    <h3>Discusión</h3>\n    <p>La discusión abandona el detalle de la secuencia y vuelve a interpretar qué significa la experiencia. Aquí aumento otra vez la profundidad porque las autoras integran hallazgos y condiciones de la práctica.</p>\n    <div class=\"bigPrompt\">Volver a ideas de mayor nivel</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Discusión", "stage": "Fuente 1 · p. 167", "desc": "Volver a ideas de mayor nivel.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 167 · pantalla 2/2", "page": "p. 167", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">167</span>\n    <div class=\"paperText\"><p>Según han probado Karmiloff y Karmiloff-Smith (2005), desde los 4 años los niños pueden realizar reflexiones explícitas y verbalizadas, y las aportaciones recogidas durante la implementación de la secuencia didáctica en el aula muestran que es posible esperar que los aprendices de esta edad empiecen a desarrollar la capacidad de inferir, que puedan leer sin saber descodificar. Somos conscientes de que, a primera vista, puede parecer que nuestra propuesta de trabajo queda fuera del alcance de los niños. No obs­ tante, animamos al profesorado de Educación Infantil a probar esta forma de trabajar con un texto de su elección y desarrollando estas u otras estrategias, pero intentando siempre hacer visibles los procesos de comprensión lectora y, a ser posible, a la vista de un libro grande, que les permitirá involucrarse mejor en la lectura.</p><p>Pentimonti y Justice (2010) comprobaron que, durante las activida­ des de lectura en voz alta, los maestros creían estar utilizando más estrategias de andamiaje de las que realmente utilizaban, y vieron, además, que los apoyos no se iban retirando gradualmente. Por nuestra parte, con frecuencia observamos que los futuros maestros encuentran enormes dificultades a la hora de verbalizar los procesos de comprensión lectora. Ello parece indicar que los docentes no han sido entrenados previamente como lectores activos</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Aquí bajo la velocidad</span></div></div>\n    <h3>Discusión</h3>\n    <p>La discusión abandona el detalle de la secuencia y vuelve a interpretar qué significa la experiencia. Aquí aumento otra vez la profundidad porque las autoras integran hallazgos y condiciones de la práctica.</p>\n    <div class=\"bigPrompt\">Volver a ideas de mayor nivel</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Cierre e implicaciones", "stage": "Fuente 1 · p. 168", "desc": "Distinguir concepto e implicaciones.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 168 · pantalla 1/2", "page": "p. 168", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">168</span>\n    <div class=\"paperText compact\"><p>y estratégicos y que, consecuentemente, es necesario formar a los futuros maestros de modo que aprendan a desarrollar un conocimiento procedimental más consciente y menos automatizado sobre los procesos de lectura.</p><p>Cuando los niños participan en la lectura interactiva de cuentos, ganan experiencias y habilidades que resultan cruciales para asentar las bases de la capacidad de comprensión lectora. Es deseable, pues, que las sesiones de lectura compartida dialógica se conviertan en una práctica frecuente en las aulas de Educación Infantil, pues constituyen una excelente oportunidad de iniciar el desarrollo de las estrategias de comprensión lectora.</p><p>BIBLIOGRAFÍA</p><p>Almodóvar, A. R. (1986). Cuentos de la media lunita. Sevilla: Algaida Editores.</p><p>Ankrum, J. W., Genest, M. T. y Belcastro, E. G. (2014). The Power of Verbal Scaffolding:</p><p>“Showing” Beginning Readers How to Use Reading Strategies. Early Childhood Education Journal, 42(1), 39-47.</p><p>Arias, N. (2014). La lectura conjunta y la interacción entre adultos y niños de 3-5 años. Revisión</p><p>de antecedentes. Panorama, 8(14), 33-46.</p><p>168 168</p><p>Baumann, J. F., Seifert-Kessell, N. y Jones, L. A. (1992). Effect of Think-Aloud Instruction</p><p>on Elementary Students’ Comprehension Monitoring Abilities. Journal of Literacy Research, 24(2), 143-172.</p><p>Beltrán, J. (1996). Procesos, estrategias y técnicas de aprendizaje. Madrid: Síntesis.</p><p>Birgisdóttir, F., Gestsdóttir, S. y Thorsdóttir, F. (2015). The Role of Behavioral Self-Regulation</p><p>in Learning to Read: A 2-Year Longitudinal Study of Icelandic Preschool Children. Early Education and Development, 1-22.</p><p>Bruner, J. (1983). Child’s Talk: Learning to use Language. New York: Norton.</p><p>Bruner, J. (1995). Actos de significado. Más allá de la revolución cognitiva. Madrid: Alianza.</p><p>Bus, A. G. (2001). Joint caregiver-child storybook reading: A route to literacy development.</p><p>Handbook of Early Literacy Research, 1, 179-191.</p><p>Callaghan, G. y Madelaine, A. (2012). Levelling the Playing Field for kindergarten Entry: Research</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Cierre e implicaciones</h3>\n    <p>Las autoras extraen implicaciones para la formación y la práctica docente. Son valiosas, pero cumplen una función distinta: muestran consecuencias del trabajo, no necesariamente nuevas propiedades del concepto que estoy definiendo.</p>\n    <div class=\"bigPrompt\">Distinguir concepto e implicaciones</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Cierre e implicaciones", "stage": "Fuente 1 · p. 168", "desc": .</p><p>Zucker, T. A., Justice, L. M., Piasta, S. B. y Kaderavek, J. N. (2010). Preschool teachers’ literal</p><p>and inferential questions and children’s responses during whole-class shared reading. Early Childhood Research Quarterly, 25(1), 65-83.</p><p>171 171</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Referencias</h3>\n    <p>El final de la bibliografía confirma la red académica en la que se inserta el artículo. No extraigo una idea conceptual, pero sí puedo anotar nuevas fuentes potenciales.</p>\n    <div class=\"bigPrompt\">Cerrar el recorrido</div>\n    "}, {"route": "Puente", "phase": "Puente", "title": "Necesito una segunda fuente", "stage": "TRANSICIÓN", "desc": "La primera lectura produjo una pregunta más precisa.", "left": "De Fuente 1 a Fuente 2", "meta": "Transición intelectual", "page": "Nueva pregunta", "transition": true, "text": "<div class=\"paperTop\">LA PRIMERA FUENTE ME PERMITIÓ AVANZAR</div><div class=\"paperTitle\">Pero ahora tengo una pregunta mejor</div><div class=\"paperText\"><p>Ya puedo sostener que la lectura compartida es cooperativa, dialógica y requiere mediación.</p><div class=\"connector\">MI NUEVA PREGUNTA</div><div class=\"marginNote\">¿Qué significa con mayor precisión que esta interacción sea “dialógica”? ¿Qué ocurre dentro de ese diálogo?</div><p>No busco una segunda fuente para sumar citas. La necesito porque la primera fuente dejó una dimensión abierta.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">→</div><div><b>Mientras investigo, tomo una nueva decisión</b><span>Cambio de fuente</span></div></div><h3>El cambio de fuente tiene una razón intelectual</h3><p>No paso de “Autor 1” a “Autor 2”. Paso de una idea parcialmente construida a una nueva necesidad de conocimiento.</p><div class=\"bigPrompt\">Fuente 1 → nueva pregunta → Fuente 2</div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Entrada al segundo texto", "stage": "Fuente 2 · p. 1", "desc": "Confirmar que responde la nueva pregunta.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 1 · pantalla 1/2", "page": "p. 1", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">1</span>\n    <div class=\"paperText compact\"><p>Pensamiento Educativo. Revista de Inv estigación Educacional Latinoamericana 2018, 55(2), 1-18</p><p>Uso del lenguaje dialógico en la lectura com- partida de literatura infantil y en la creación de historias conjuntas: Aportes de la psicología educativa histórico-cultural al desarrollo de la conciencia narrativa infantil</p><p>Use of dialogic language in the shared reading of children’s literature and the creation of joint histories: Contributions of historical-cultural educational psychology to children’s narrative awareness</p><p>Claudia Ximena González-Moreno</p><p>Pontificia Universidad Javeriana, Colombia</p><p>Resumen</p><p>El lenguaje dialógico en la lectura compartida de literatura infantil y en la creación de historias conjuntas se constituye en un medio de interacción comunicativa esencial para promover el desarrollo de la narrativa y el aprendizaje infantil. El objetivo de esta investigación es analizar cómo el uso del lenguaje dialógico influye en la lectura compartida de literatura infantil y en la creación de historias conjuntas entre un adulto y un niño en edad preescolar de 4 años. Se realizó un estudio de caso único, bajo una metodología cualitativa con carácter longitudinal. Se usó el método formativo propuesto por Vigotsky en el que se analizó la génesis de la conciencia narrativa y cómo el niño la utiliza en sus acciones. Además, se analizó cómo el adulto crea las condiciones necesarias para el desarrollo de la zona de desarrollo potencial de la narrativa en el niño. Los resultados muestran que el uso del lenguaje dialógico permite aprender acerca del otro, sus intenciones y algunos aspectos de las relaciones humanas como la valentía o la necesidad de protección. Finalmente, se presenta una reflexión respecto a la importancia de la creación de historias conjuntas en la primera infancia.</p><p>Palabras clave: lenguaje, creación de historias, narrativa, imaginación, alfabetización inicial</p><p>Correspondencia a:</p><p>Claudia Ximena González-Moreno Pontificia Universidad Javeriana email: clauxigo@hotmail.com</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Primero hago barrido</span></div></div>\n    <h3>Entrada al segundo texto</h3>\n    <p>El título y el resumen permiten comprobar que el lenguaje dialógico es central. Esta fuente parece pertinente porque profundiza justo la dimensión que dejó abierta el primer artículo.</p>\n    <div class=\"bigPrompt\">Confirmar que responde la nueva pregunta</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Entrada al segundo texto", "stage": "Fuente 2 · p. 1", "desc": "Confirmar que responde la nueva pregunta.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 1 · pantalla 2/2", "page": "p. 1", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">1</span>\n    <div class=\"paperText\"><p>© 2018 PEL, http://www.pensamientoeducativo.org - http://www.pel.cl</p><p>ISSN:0719-0409 DDI:203.262, Santiago, Chile doi: 10.7764/PEL.55.2.2018.9</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Primero hago barrido</span></div></div>\n    <h3>Entrada al segundo texto</h3>\n    <p>El título y el resumen permiten comprobar que el lenguaje dialógico es central. Esta fuente parece pertinente porque profundiza justo la dimensión que dejó abierta el primer artículo.</p>\n    <div class=\"bigPrompt\">Confirmar que responde la nueva pregunta</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Resumen e introducción", "stage": "Fuente 2 · p. 2", "desc": "Ubicar el propósito.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 2 · pantalla 1/2", "page": "p. 2", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">2</span>\n    <div class=\"paperText\"><p>Abstract</p><p>Dialogic language in the shared reading of children’s literature and in the creation of joint stories is a means of essential communicative interaction to promote the development of children’s narrative and learning. The aim of this research is to analyze how the use of dialogic language influences the shared reading of children’s literature and the creation of joint stories between an adult and a preschool child of 4 years. A single case study was conducted under a qualitative methodology of a longitudinal nature. We used the formative method proposed by Vygotsky in which we analyzed the genesis of the narrative awareness and how the child uses it in his actions. In addition, it was analyzed how the adult creates the necessary conditions for the development of the zone of potential development of the narrative in the child. The results show that the use of dialogic language allows learning about the other, their intentions and some aspects of human relationships such as courage or the need for protection. Finally, the article presents a reflection on the importance of the creation of joint stories in early childhood. Keywords: language, story creation, narrative, imagination, early literacy</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Resumen e introducción</h3>\n    <p>Esta zona presenta el problema y el enfoque general. Me ayuda a saber qué tipo de estudio estoy leyendo y por qué el diálogo importa, pero todavía no necesito extraer una definición.</p>\n    <div class=\"bigPrompt\">Ubicar el propósito</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Resumen e introducción", "stage": "Fuente 2 · p. 2", "desc": "Ubicar el propósito.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 2 · pantalla 2/2", "page": "p. 2", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">2</span>\n    <div class=\"paperText compact\"><p>Recientes investigaciones están emergiendo sobre cómo la conciencia narrativa tiene efectos sobre el aprendizaje infantil. Luego, este artículo establece relaciones entre la narrativa y la educación. En un primer momento se presentan algunos antecedentes conceptuales y empíricos acerca de la narrativa en la edad preescolar. Después se presenta la experiencia de uso del lenguaje dialógico en la lectura de cuentos y en la creación narrativa con un niño en la transición de la edad preescolar a la escolar. El compartir la experiencia de lectura de cuentos implica una convergencia de miradas vueltas hacia la página y dan libre curso a las emociones, por lo que se constituye en un aspecto esencial de la primera infancia (Turin, 2014). La discusión se refiere a los alcances de la narrativa en la transición entre la edad preescolar y la escolar. Por lo tanto, en este punto, esta investigación ofrece la posibilidad de pensar en la narrativa en relación al ámbito educativo en lo que se refiere a la alfabetización inicial. Antecedentes El niño inicia el contacto con las narraciones cuando empieza a participar de actividades de conversación y de lectura compartida con el adulto (Abraham y Brenca, 2016). En estas interacciones se usan los libros como advierte Reyes (2016, p. 68) “como espejos para mirar y ser mirados, para tocar: para explorar un mundo que se ensancha cada día. La conversación que circula en el triángulo amoroso –niño, libro, adulto– va más allá de las páginas. Son dos personas que se encuentran en ese espacio otro; ya son dos mirando a un tercero. En esa historia que la voz del adulto va contando liga una imagen con la otra: lo de atrás con lo de adelante, el tiempo con el espacio, las palabras con las ilustraciones, el libro con la vida”. La actividad de escuchar un cuento y de aprendizaje narrativo es esencial porque le permite al niño imaginar las situaciones, adquirir más conocimientos sobre el mundo social y cultural, aprender a escuchar con atención, formar sentimientos y afectos por los personajes positivos y bondadosos y se enoja con los personajes que tienen actitudes negativas con los demás, lo que le posibilita encontrar su propia posición moral (Solovieva y Quintanar, 2005). El aprendizaje narrativo se dirige a la interpretación y comprensión de la acción humana. La acción en el enfoque histórico-cultural se constituye en la unidad consciente de la actividad y se determina por la presencia de un objetivo establecido, inicialmente por el adulto, quien dirige la actividad del niño y posteriormente por el mismo niño, quien ya se hace capaz de establecerlo (Solovieva y Quintanar, 2012). El aprendizaje narrativo posibilita la resolución de problemas de la vida (Hakkarainen, 2006), además involucra interacciones dialógicas con el otro y hace parte del proceso de la comunicación verbal y no verbal. La actividad de narrar usando el lenguaje implica la selección y ordenamiento de sucesos, esta actividad es el modo fundamental de la mente en la comunicación con los otros (Bruner, 1986). Tanto la comprensión como la expresión narrativa involucran la habilidad de atribuir significado e intencionalidad para realizar interpretaciones de acciones verbales y no verbales.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Resumen e introducción</h3>\n    <p>Esta zona presenta el problema y el enfoque general. Me ayuda a saber qué tipo de estudio estoy leyendo y por qué el diálogo importa, pero todavía no necesito extraer una definición.</p>\n    <div class=\"bigPrompt\">Ubicar el propósito</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Lenguaje narrativo e imaginación", "stage": "Fuente 2 · p. 3", "desc": "Reconocer el marco amplio.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 3 · pantalla 1/1", "page": "p. 3", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">3</span>\n    <div class=\"paperText compact\"><p>El lenguaje narrativo se constituye en un medio para reestructurar el pensamiento, que posibilita el despliegue de la imaginación, la cual cumple un rol fundamental en la comprensión de nuevos aprendizajes y en la interpretación de la realidad (Aguirre, 2012). El lenguaje narrativo es una habilidad semiótica que puede utilizarse como medio o vehículo de expresión en la comunicación (Reyes Trigos, 2003). El lenguaje narrativo implica habilidades cognitivas reflexivas complejas. “Una narración es un relato de experiencias o eventos que son temporalmente secuenciados y transmiten un significado. Es a través de contar historias que los niños desarrollan una voz personal, una manera de comunicar su experiencia única y su visión del mundo” (Engel, en Bredikyte, 2011, p. 19). Para Bredikyte (2011) la narrativa no necesariamente tiene que ser expresada en una forma verbal, por lo que el juego y los dibujos de los niños pueden considerarse como narrativas que expresan su opinión y sentido personal. La narración es tanto un producto de un proceso de desarrollo como un vehículo del desarrollo (Bredikyte, 2011). En la narrativa los niños dominan las herramientas psicológica básicas para pensar y para la formación de su propia identidad (Hakkarainen y Bredikyte, 2015). Por ello, es importante promover el desarrollo de la conciencia narrativa para reflexionar acerca del uso del lenguaje y de las acciones. La conciencia narrativa se refiere al progreso gradual del niño en el conocimiento sobre las características formales de la historia: la adquisición del esquema narrativo y el desarrollo de las expectativas sobre los personajes (Colomer, 1997), lo que le permite establecer nexos causales entre las acciones y ser más capaz analizar lo que está ocurriendo en las ilustraciones (Colomer, 2005, 2009). Las estructuras narrativas que muestran progresos en la conciencia narrativa del niño se caracterizan por: una asociación de ideas entre los elementos donde una idea lleva a la otra estableciendo relaciones, identificar las acciones y aventuras de los personajes de manera organizada, así como por proponer un final en relación con el conflicto planteado en el inicio (Applebee, 1978). Lenguaje narrativo y alfabetización inicial Varias investigaciones han presentado evidencias de la importancia del lenguaje narrativo en la infancia (Bredikyte, 2010; Hakkarainen &amp; Bredikyte, 2014, 2015). Se considera que el lenguaje narrativo influye en la alfabetización inicial (Whitehurst &amp; Lonigan, 1998; Dickinson &amp; Tabors, 2001; Dickinson et al, 2003; Bowyer-Crane et al, 2008; Strasser et al, 2010; Weisberg, Zosh, Hirsh-Pasek &amp; Golinkoff, 2013). Las investigaciones relacionan el lenguaje narrativo con el aprendizaje del vocabulario comprensivo y expresivo (Dickinson et al, 2003), el aprendizaje de estructuras gramaticales y lingüísticas (Weisberg, Zosh, Hirsh-Pasek &amp; Golinkoff, 2013), el éxito en el aprendizaje de la lectura, la escritura y el rendimiento académico en general (Snow, 2017), el poder de la palabra y de la representación cultural de uno mismo y de su realidad (Petit, 2001; Colomer, 2005), el desarrollo de habilidades imaginativas (Colomer, 2009). La alfabetización inicial se refiere a un proceso consciente que requiere del uso de un sistema de signos y posibilita la comunicación e intercambio de ideas para participar activamente en el mundo social y cultural. “La alfabetización es la habilidad de leer el mundo, es la habilidad de continuar aprendiendo y es la llave de la puerta del conocimiento. La alfabetización es una experiencia creadora” (Freire, 1990, p. 19). La alfabetización inicial posibilita el desarrollo de habilidades imaginativas creadoras particulares con el uso del lenguaje y a su vez permite generar y fortalecer vínculos afectivos y sociales. Por esta razón, las habilidades alfabéticas requieren del desarrollo de destrezas comunicativas, cognitivas y lingüísticas complejas por lo que se necesita de un entrenamiento específico e intencional para su adquisición. Este entrenamiento demanda de la inclusión del concepto de zona de desarrollo potencial, el cual se refiere a la formación de habilidades que aún no han madurado, que se encuentran en proceso de maduración (Vigotsky, 1995). “La zona de desarrollo potencial es la distancia entre el nivel de desarrollo actual (que se determina con ayuda de tareas que se solucionan de manera independiente) y el nivel de desarrollo probable, que se determina con ayuda de tareas que se solucionan bajo la orientación y dirección de los adultos” (Vigotsky en Solovieva, 2014, p. 147). Este concepto involucra el uso de tipos de apoyo (animación, conversación-lenguaje dialógico, ejemplo) para promover y facilitar la participación del niños en actividades conjuntas, en este caso específico en lectura compartida y creación de historias.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Lenguaje narrativo e imaginación</h3>\n    <p>El texto desarrolla narrativa, imaginación y desarrollo psicológico. Es el trasfondo teórico de la autora. Lo necesito para entender su mirada, pero mi pregunta actual sigue siendo más específica: qué significa la dialogicidad.</p>\n    <div class=\"bigPrompt\">Reconocer el marco amplio</div>\n    "}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Ambiente rico en lenguaje", "stage": "Fuente 2 · p. 4", "desc": "Acercarme a la interacción.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 4 · pantalla 1/1", "page": "p. 4", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">4</span>\n    <div class=\"paperText compact\"><p>Lo más importante para que los niños desarrollen habilidades alfabéticas iniciales es proporcionar un ambiente rico en lenguaje, es decir, que los maestros y cuidadores aseguren que los niños están involucrados en conversaciones sobre las cosas que son de su interés, además de proporcionarles oportunidades de incorporarse en actividades lúdicas (Yoshikawa et al, 2015). Al mismo tiempo, antes de iniciar la enseñanza formal de la lectura y la escritura, es necesario asegurarse de que en el niño existe el interés y el sentido personal por estas actividades, por lo que garantizar esta motivación es uno de los objetivos principales en la edad preescolar (Solovieva y Quintanar, 2012). En la figura 1 se presenta la relación entre el uso del lenguaje dialógico en la lectura de cuentos y en la creación de historias de la edad preescolar para el aprendizaje alfabético inicial de la edad escolar. Por un lado, el uso del lenguaje dialógico se configura en un medio que permite que el niño reestructure la comprensión y creación de nuevas narraciones, también permite que reorganice sus ideas para hablar acerca del lenguaje al comprender y construir nuevas relaciones entre las palabras. Por otro lado, el lenguaje dialógico posibilita la regulación de acciones en el niño. La lectura de cuentos y la creación de historias se constituyen en medios externos que generan motivos cognoscitivos para aprender a leer y a escribir en el niño. Desde el momento en que surge el motivo concreto como el objeto de la actividad surge la actividad misma (Solovieva y Quintanar, 2012), la actividad de leer y la actividad de escribir.</p><p>Figura 1. Efectos de la lectura de cuentos y la creación de historias de la edad preescolar en el aprendizaje alfabético inicial de la edad escolar *Fuente: Elaboración propia.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Ambiente rico en lenguaje</h3>\n    <p>Aparecen conversación, interacción y rol del adulto. Esta zona se acerca a mi pregunta y prepara la sección clave, pero todavía funciona como antecedente y contextualización.</p>\n    <div class=\"bigPrompt\">Acercarme a la interacción</div>\n    "}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Lenguaje dialógico", "stage": "Fuente 2 · p. 5", "desc": "Aquí sí me detengo.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 5 · pantalla 1/1", "page": "p. 5", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">5</span>\n    <div class=\"paperText compact\"><p>Lenguaje dialógico y creación de historias <span class=\"hl\">El lenguaje dialógico es el medio de interpretar y regular la cultura</span> (Bruner, 2000). Al usar el lenguaje dialógico <span class=\"underline\">se pueden negociar significados</span> para lo cual se necesita de la ayuda de los adultos en la conversación interactiva. Así, los niños empiezan a expresar su interpretación del mundo usando el lenguaje y los adultos responden a sus necesidades comunicativas. De esta manera, se genera la dinámica interactiva en el uso del lenguaje, en donde las palabras poseen un poder simbólico que permite compartir experiencias conjuntas de la realidad y de la fantasía con los niños en la narrativa. Bruner (1986) plantea que la narrativa es un modo universal de lenguaje humano y un modo universal de pensamiento. Para Bruner (1988) la forma narrativa de la mente involucra secuencias orientadas a la acción. El lenguaje narrativo permite establecer relaciones entre sentimientos, pensamientos y acciones (Bruner, 2007). Aquí el pensamiento toma la forma de historia. Por esta razón Bruner (1984, 1988) afirma que la narrativa permite organizar nuestras propias experiencias con sentido y significado. Algunas características de la narrativa son la secuencia de acciones que comunican significados, la toma de una postura propia y la intencionalidad en la expresión de actitudes (Bruner, 1986, 2008). El lenguaje dialógico se constituye en un instrumento psicológico necesario en la interacción comunicativa para la creación de historias conjuntas entre el niño y el adulto. A través del lenguaje dialógico el niño puede <span class=\"hl2\">organizar, interpretar y atribuir significado</span> a su experiencia de creación de historias. El lenguaje dialógico permite relacionarse con el mundo y comprenderlo mejor. Además con el lenguaje dialógico el niño tiene la posibilidad de expresarse y de compartir aquello que piensa y siente. El lenguaje dialógico involucra el uso de la palabra con cuatro componentes fundamentales: el significado que implica la generalización y la introducción del objeto en determinado sistema de categorías (Luria, 1995), la actividad interpretativa en un mundo simbólico (Reyes, 2016), la posibilidad para hablar sobre el lenguaje mismo (Colomer, 2009) y la posibilidad de ampliar la experiencia social y cultural (Vigotsky, 1995). El uso del lenguaje dialógico en la creación de historias ayuda a que el niño se dé cuenta de que las palabras son representaciones del mundo de la experiencia (Colomer, 2005). El lenguaje dialógico en la creación de historias posibilita alcanzar el dominio de varias funciones del discurso narrativo (social, cultural y estética) lo que facilita la organización lingüística y la intersubjetividad, es decir, aquello que se comparte con el otro (experiencias emocionales) (Bruner, 1988). La narración permite imaginar solo con palabras o con el apoyo de ilustraciones lejos de la situación contextual (Colomer, 2005). El lenguaje dilógico se transforma durante las interacciones comunicativas dialécticas e interactivas entre el adulto y el niño en la creación de historias. Luria (1995) señala que el lenguaje dialógico es una herramienta del pensamiento. El lenguaje le otorga al pensamiento su carácter verbal, conceptual y mediatizado (Vigotsky, 1995). Las expresiones verbales constituyen la transformación del pensamiento en la palabra (Vigotsky, 1982). En el lenguaje el pensamiento se forma y formula (Rubinshtein, 1998). En la creación de historias al usar el lenguaje dialógico las imágenes y las palabras ayudan a que los niños incursionen en la experiencia estética (Colomer, 2005). Esto significa que “las imágenes y las palabras desempeñan un papel fundamental en el desarrollo de la sensibilidad de los niños y marcan profundamente su futura vida afectiva e intelectual” (Da Coll, 1987, p. 3). Las palabras en la creación de historias introducen a los niños en una nueva forma de comunicación para expresar la realidad (Colomer, 2005). La capacidad de un niño para comprender y producir una narración implica una instancia privilegiada del lenguaje dialógico que involucra el dominio de habilidades lingüísticas y cognitivas complejas, tales como secuenciar eventos, usar vocabulario preciso, comunicar ideas y comprender relaciones causa-efecto (Abraham y Brenca, 2016). Por lo anterior, el objetivo de esta investigación es analizar cómo surge la conciencia narrativa con el uso del lenguaje dialógico durante la lectura compartida de literatura infantil y la creación de historias conjuntas entre un adulto y un niño en edad preescolar de 4 años. Se tienen en cuenta las estrategias que utiliza el adulto</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Aquí bajo la velocidad</span></div></div>\n    <h3>Lenguaje dialógico</h3>\n    <p>La autora conceptualiza el lenguaje dialógico y habla de negociar significados, interpretar y responder a necesidades comunicativas. Esta zona amplía directamente lo construido con la primera fuente.</p>\n    <div class=\"bigPrompt\">Aquí sí me detengo</div>\n    <div class=\"action\"><b>Conexión con Fuente 1</b><p>“Negociar significados” profundiza aquello que el primer artículo llamaba situaciones dialógicas.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Objetivos y enfoque del estudio", "stage": "Fuente 2 · p. 6", "desc": "Distinguir teoría y diseño.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 6 · pantalla 1/1", "page": "p. 6", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">6</span>\n    <div class=\"paperText compact\"><p>para la identificación de la zona de desarrollo potencial del niño en la creación de historias. Asimismo, se analiza el desarrollo de las habilidades de imaginación en el niño durante la lectura compartida de literatura infantil y la creación de historias conjuntas. Finalmente se analiza el impacto de la creación de historias de la edad preescolar en la edad escolar. Método En esta investigación se realizó un estudio de caso único, con carácter longitudinal bajo una metodología cualitativa. Se usó el método formativo propuesto por Vigotsky (1995) en el que se analiza a través del uso del lenguaje dialógico la génesis de la conciencia narrativa y cómo el niño la utiliza, así como el desarrollo de la imaginación durante la creación de historias. Esta metodología introduce y desarrolla los aspectos psicológicos (tipos de acciones y/o formas de actividad) en el niño (González-Moreno y Solovieva, 2014). Asimismo, el experimento formativo implica el conocimiento del contenido, la estructura, y las características deseables de las acciones que se pretende introducir o desarrollar en el niño (Galperin, 1986a, 1986b, 1995). Participante Un niño con desarrollo psicológico y de lenguaje típico que cursaba segundo, su rango etario era de 4 años de edad (al inicio) y 6 años de edad (al final). El niño participó con un adulto (fonoaudióloga experta en desarrollo psicológico infantil) en interacciones comunicativas diversas. El niño participó en el estudio durante 3 años (segundo grado de preescolar, tercer grado de preescolar y primero de primaria). Etapas de la investigación La investigación se desarrolló durante tres años. En cada año se desarrolló una etapa (ver tabla 1). En la primera parte de esta investigación se leyeron cuentos de literatura infantil conjuntamente. Se leyeron dos tipos de cuentos: cuentos tradicionales y libros álbum. Estos dos tipos de libros ofrecieron al niño un acervo de descubrimientos, sorpresas y preguntas, los cuales se constituyeron en un espejo de sus emociones y un trampolín para el despliegue de su imaginación como lo propone Turin (2014). Cada cuento fue leído en varias oportunidades (3 o 4 veces) porque el niño los pedía una y otra vez. En la segunda parte se crearon historias conjuntas con el niño utilizando imágenes de libros álbum y las preguntas ¿Qué pasaría si…? Eso significa que había apoyos de medios perceptivos y verbales para ayudar a activar esquemas cognitivos y lingüísticos en el niño. En la tercera parte se identificó el impacto de la creación narrativa de la edad preescolar a la edad escolar.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Objetivos y enfoque del estudio</h3>\n    <p>El artículo pasa hacia objetivos y desarrollo de la investigación. Ya obtuve una idea conceptual fuerte; ahora cambio la profundidad porque entra información sobre cómo se estudió el fenómeno.</p>\n    <div class=\"bigPrompt\">Distinguir teoría y diseño</div>\n    "}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Etapas de la investigación", "stage": "Fuente 2 · p. 7", "desc": "Leer método como método.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 7 · pantalla 1/3", "page": "p. 7", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">7</span>\n    <div class=\"paperText\"><p>Tabla 1. Etapas del desarrollo de la investigación</p><p>Etapas Descripción 1.Lectura compartida de cuentos tradicionales y libros álbum (60 sesiones)</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Etapas de la investigación</h3>\n    <p>La tabla explica la secuencia de actividades. Sirve para comprender cómo se produjo la evidencia, pero no la convierto automáticamente en contenido del marco teórico.</p>\n    <div class=\"bigPrompt\">Leer método como método</div>\n    <div class=\"call\"><b>Esta página ocupa 3 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 3.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Etapas de la investigación", "stage": "Fuente 2 · p. 7", "desc": "Leer método como método.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 7 · pantalla 2/3", "page": "p. 7", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">7</span>\n    <div class=\"paperText compact\"><p>Conjuntamente adulto y niño compartían literatura infantil: cuentos tradicionales y libros álbum. Se consideraron varias estrategias. El adulto permitía que el niño eligiera un libro, el adulto elegía el libro. Antes de que el adulto eligiera el libro compartía con el niño algunos juegos con objetos y juguetes para identificar intereses y motivaciones particulares del niño. La lectura se hacía en el piso en medio de cojines de colores y juguetes relacionados con la historia que se contaba. El niño tenía la posibilidad de ver el libro y sus imágenes, también preguntaba sobre lo que quisiera antes de iniciar la lectura. El adulto usaba voces distintas de acuerdo a los personajes que intervenían, también hacía algunas representaciones con gestos y con el uso de objetos. Cuando se identificaba alguna palabra extraña se usaba un diccionario de imágenes y se le explicaba al niño su significado. Durante las interacciones dialógicas se hablaba y se pensaba acerca del contenido de los libros y de los libros mismos: sus características: ilustraciones, autores, situaciones vividas por los personajes, sentimientos experimentados. 2.Creación de historias conjuntas (50 sesiones) Conjuntamente adulto y niño creaban historias. Al principio el adulto proponía inicios, personajes, situaciones y problemas. Para esto, el adulto usaba objetos e imágenes, también seleccionaba algunos personajes y situaciones de los cuentos leídos previamente. De esta manera el adulto facilitaba que el niño continuara con la creación de las historias y que aportara de acuerdo a sus intereses particulares. Antes de crear las historias se proponían juegos, después se elegían algunas situaciones del juego o de los cuentos leídos en la fase anterior y se iniciaba con la nueva historia. El adulto observaba y escuchaba atentamente al niño para identificar qué es lo que cautivaba, también ayudaba al niño a tomar turnos haciendo comentarios o preguntas. 3.Identificación del impacto de la creación narrativa de la edad preescolar a la edad escolar (50 sesiones)</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Etapas de la investigación</h3>\n    <p>La tabla explica la secuencia de actividades. Sirve para comprender cómo se produjo la evidencia, pero no la convierto automáticamente en contenido del marco teórico.</p>\n    <div class=\"bigPrompt\">Leer método como método</div>\n    <div class=\"call\"><b>Esta página ocupa 3 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 3.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Etapas de la investigación", "stage": "Fuente 2 · p. 7", "desc": "Leer método como método.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 7 · pantalla 3/3", "page": "p. 7", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">7</span>\n    <div class=\"paperText\"><p>Se registró a manera de diario de campo las características de la conversación narrativa, lectura de cuentos y escritura narrativa del niño. Se hizo observación en el aula de clase y también se compartieron algunas actividades con el niño. También se observó su cuaderno de dibujo y de creación de historias. *Fuente: Elaboración propia.</p><p>Materiales Los cuentos tradicionales que se leyeron hacen parte de la propuesta de los hermanos Grimm: “Hansel y Gretel”, “el rey sapo”, “el sastrecillo valiente”, “Rapónchigo”, “la señora Holle”, “el enano saltarían”, “el ganso de oro”, “el gato con botas”, “Caperucita roja”, “Pulgarcito”. Los libros álbum leídos conjuntamente con el niño hacen parte de las propuestas de Oliver Jeffers “¿Cómo atrapar una estrella?”, “atrapados”, “el misterioso caso del oso”, “el increíble niño come libros”, “de vuelta a casa”, “el día en que los crayones renunciaron”, “este alce es mío”, “perdido y encontrado”; de William</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Etapas de la investigación</h3>\n    <p>La tabla explica la secuencia de actividades. Sirve para comprender cómo se produjo la evidencia, pero no la convierto automáticamente en contenido del marco teórico.</p>\n    <div class=\"bigPrompt\">Leer método como método</div>\n    <div class=\"call\"><b>Esta página ocupa 3 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 3 de 3.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Materiales utilizados", "stage": "Fuente 2 · p. 8", "desc": "Reconocer transparencia metodológica.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 8 · pantalla 1/2", "page": "p. 8", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">8</span>\n    <div class=\"paperText compact\"><p>Steig “Silvestre y la piedrecita mágica” y de Claudia Rueda “la suerte de Ozu”, “vaya apetito tiene el zorrito”, “dos ratones, una rata y un queso”, “la vida salvaje: diario de una aventura”, “un día de lluvia”, “formas”, “PUM”, “todo es relativo”, “ahí estabas”, “mientras se enfría el pastel”. En esta investigación las imágenes que se convirtieron en indicios para activar esquemas cognitivos, los cuales proponían códigos diversos para que el niño los interpretara de acuerdo a su experiencia. Categorías de análisis Para esta investigación se identificaron las categorías de análisis que se presentan en la tabla 2. Estas categorías surgieron de esta experiencia de investigación.</p><p>Tabla 2. Categorías de análisis</p><p>Categorías de análisis Descripción Lenguaje dialógico en la lectura de cuentos y la creación de historias Aclarar pensamientos Hace referencia a la posibilidad de explicar con palabras las ideas.</p><p>Aclarar sentimientos Uso de palabras para expresar lo que se siente.</p><p>Aclarar acciones Tiene que ver con el uso de la palabra para explicar acciones de los personajes de los cuentos leídos o de los cuentos creados. Hablar sobre el lenguaje Uso de la palabra para transformar las ideas de forma creativa.</p><p>Secuenciación de acciones Expresiones sobre la organización de las acciones en la historia.</p><p>Toma de un punto de vista propio Dar sentido a la situación y elegir una alternativa.</p><p>Identificación de palabras generalizadoras para organizar y jerarquizar la información</p><p>Uso del lenguaje para organizar y jerarquizar la información.</p><p>Habilidades narrativas que se desarrollaron en la lectura de cuentos y en la creación de historias Generación de sentidos y significados Uso del lenguaje para explicar diversas situaciones y acciones de las historias.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Materiales utilizados</h3>\n    <p>La descripción de libros y materiales permite entender las condiciones del estudio. No responde directamente mi pregunta conceptual, así que no me detengo en cada título.</p>\n    <div class=\"bigPrompt\">Reconocer transparencia metodológica</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Materiales utilizados", "stage": "Fuente 2 · p. 8", "desc": "Reconocer transparencia metodológica.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 8 · pantalla 2/2", "page": "p. 8", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">8</span>\n    <div class=\"paperText\"><p>Negociación de significados Uso del lenguaje para ponerse de acuerdo sobre el significado de situaciones y acciones de los personajes de la historia. Compartir el mundo mental Considerar la postura del otro, lo que piensa el otro para lograr que lo que se dice sea apreciable para el otro. Cambios en la forma de ver la experiencia Con el uso del lenguaje se establecen relaciones con el mundo para comprenderlo mejor.</p><p>Planificación de acciones Tener presente el objetivo de la acción que se realiza al crear las historias y de las acciones que realizan los personajes. Habilidades de imaginación en la lectura de cuentos y en la creación de historias Situarse desde diversas perspectivas lo que permite sentir de distintas maneras</p><p>Ser capaz de identificar diferentes perspectivas lo que posibilita sentir de diversas maneras lo que sienten los personajes de las historias.</p><p>Imaginar estrategias diversas para resolver problemas a través del lenguaje</p><p>Imaginar diversas opciones para resolver un problema y elegir la más conveniente.</p><p>*Fuente: Elaboración propia.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Materiales utilizados</h3>\n    <p>La descripción de libros y materiales permite entender las condiciones del estudio. No responde directamente mi pregunta conceptual, así que no me detengo en cada título.</p>\n    <div class=\"bigPrompt\">Reconocer transparencia metodológica</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Procedimiento", "stage": "Fuente 2 · p. 9", "desc": "Comprender cómo se produjo la evidencia.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 9 · pantalla 1/1", "page": "p. 9", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">9</span>\n    <div class=\"paperText compact\"><p>Procedimiento Se registró con videocámara cada una de las situaciones de conversación en las que se leyeron los cuentos y durante la creación de las historias. Cada sesión tuvo una duración de 40 minutos. La videograbación era analizada y transcrita de manera permanente a manera de bitácora. Una vez realizadas las transcripciones de las interacciones comunicativas se hicieron relaciones entre los cuentos leídos y las historias creadas. En esta investigación ambos participantes (niño y adulto) crearon historias conjuntas y realizaron acciones simbólicas correspondientes a las situaciones imaginarias que emergían. Por medio de estas acciones el adulto creó la zona de desarrollo potencial al usar el lenguaje dialógico. El adulto utilizó el lenguaje no verbal (sorpresa, asombro) y aspectos suprasegmentales (entonación de la voz), lo generó un ambiente de diversión. Rol del adulto El adulto participó observando al niño (sus intereses y motivaciones), orientando las actividades (con el uso del lenguaje con estructura narrativa) y también se convirtió en un compañero genuino del niño durante la lectura de cuentos y la creación de historias. El adulto utilizó estrategias de interacción dialógica con el niño. En esta experiencia el adulto necesitó ser sensible al leer al niño así como sus gestos, miradas, formas de comunicación utilizando diversos medios culturales (dibujos y objetos). Además el adulto fue sensible a las interpretaciones y situaciones imaginarias que el niño creó en su mente y que expresó usando el lenguaje para organizar y dar sentido y significado a su experiencia. El adulto siempre se mostró entusiasmado cuando leía, se involucraba en el cuento y se emocionaba con el niño, era expresivo y le daba vida al libro. En la lectura compartida el adulto ayudaba al niño a relacionar las historias con la propia experiencia, también comparaba y describía las personas, lugares y situaciones de las imágenes. De esta manera, el adulto ayudaba al niño a observar y a identificar detalles particulares y específicos de las representaciones gráficas. El adulto también hablaba de los sentimientos y opiniones de los personajes y compartía sus opiniones acerca de las situaciones de las historias. Igualmente, el adulto imaginaba un final distinto para el cuento, invitaba al niño a proponer otro final y representaban el cuento conjuntamente a través de juegos de roles (González- Moreno y Solovieva, 2014; González-Moreno, Solovieva y Quintanar, 2014; González-Moreno, 2015; González-Moreno, 2016a, 2017b, 2016c). Resultados En esta investigación se analizó la génesis de la conciencia narrativa con el uso del lenguaje dialógico durante la lectura de cuentos y la creación de historias nuevas, asimismo se analizó cómo el niño utiliza la narrativa en sus acciones y cómo el adulto crea las condiciones necesarias para el desarrollo de la zona de desarrollo potencial de la narrativa en el niño. La génesis de la conciencia narrativa se presentó con el uso de la palabra en el lenguaje dialógico para establecer vínculos comunicativos en los que el niño expresó su sentir personal, sus opiniones y su forma de ver el mundo. El niño usó la narrativa en sus acciones con voz propia la cual articuló sentidos y significados, lo que permitió el desarrollo de habilidades narrativas e imaginativas. Las habilidades narrativas (generación de sentidos y significados, negociación de significados, compartir el mundo mental, voz narrativa personal, cambios en la forma de ver la experiencia y planificación de acciones) en el niño surgieron con ayuda del uso del lenguaje dialógico creando situaciones imaginarias que permitieron sustituir la realidad y representar lo ausente con lo imaginario. El uso del lenguaje dialógico también posibilito que lo que el niño hacía en colaboración con el adulto (creación del ambiente en el cuento, eventos, lugares, acciones, personajes, deseos, intenciones que guían la secuencia de un plan, acciones para la resolución de una meta) poco a poco lo empezara a realizar de manera independiente (propuesta por iniciativa propia de situaciones, personajes y acciones en las historias). El uso del lenguaje dialógico entre el adulto y el niño durante la lectura de cuentos y la creación de nuevas historias permitió reformular de manera detallada situaciones imaginarias diversas (situarse desde diversas perspectivas lo que le permitió sentir de distintas maneras, ampliar la experiencia imaginativa e imaginar estrategias diversas para resolver problemas a través del lenguaje) que mezclaban temas y personajes en un ambiente narrativo. Además el uso del lenguaje dialógico permitió aclarar pensamientos, sentimientos,</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Procedimiento</h3>\n    <p>El procedimiento explica registros, sesiones y análisis. Esta información es importante para evaluar el estudio, pero no para definir lectura compartida. Cambio de modo: leo para valorar la fuente, no para citarla en el concepto.</p>\n    <div class=\"bigPrompt\">Comprender cómo se produjo la evidencia</div>\n    "}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Resultados iniciales", "stage": "Fuente 2 · p. 10", "desc": "Separar evidencia y conceptualización.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 10 · pantalla 1/3", "page": "p. 10", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">10</span>\n    <div class=\"paperText\"><p>acciones, hablar sobre el lenguaje, tomar una postura y resolver problemas desde una perspectiva personal. En la tabla 3 se presenta la relación del lenguaje dialógico con la lectura de cuentos y la creación de historias. Tabla 3. Relación del lenguaje dialógico con la lectura de cuentos y la creación de historias</p><p>Lenguaje dialógico Lectura de cuentos Creación de historias Aclarar pensamientos El niño realizaba preguntas para aclarar las situaciones de lectura compartida. Por ejemplo, “¿Qué significa pluma de oro?”</p><p>La palabra permitió transmitir las experiencias internas otorgándoles nuevos sentidos. Por ejemplo: “Sentí alegría cuando el oso se encontró con sus papás, ya no estaba solito”. Aclarar sentimientos El niño ponía nombre a los sentimientos. Por ejemplo, “me sentí sorprendido con ese final, no imaginé que podría pasar eso, fue lindo” en el desenlace de la historia.</p><p>El niño en sus historias hacía hablar a los personajes para expresar sentimientos: alegría, tristeza, enojo, sorpresa. Por ejemplo, “el conejito estuvo muy feliz cuando cumplió años y todos sus amigos lo visitaron”. Aclarar acciones El niño identificaba las acciones de los personajes y establecía comparaciones con situaciones cotidianas para entender lo que sucedía con los personajes de las historias. Por ejemplo, “Recuerdo que el fin de semana visité a mi abuelita, así como hizo Caperucita Roja. Yo también le llevé pastelitos que mi mamá le preparó con mucho amor”.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Resultados iniciales</h3>\n    <p>Empiezan resultados y categorías. Puedo mirar qué formas de lenguaje aparecen, pero debo recordar que ahora estoy construyendo un marco teórico, no todavía un estado del arte completo.</p>\n    <div class=\"bigPrompt\">Separar evidencia y conceptualización</div>\n    <div class=\"call\"><b>Esta página ocupa 3 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 3.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Resultados iniciales", "stage": "Fuente 2 · p. 10", "desc": "Separar evidencia y conceptualización.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 10 · pantalla 2/3", "page": "p. 10", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">10</span>\n    <div class=\"paperText compact\"><p>El niño usaba las palabras para hilar las situaciones de las historias revelando insospechadas acciones en las situaciones de las historias. Por ejemplo, “Primero la tortuga estaba caminando despacito, muy despacito, luego un poquito más rápido y luego se cansó. Entonces ella tuvo que detenerse a descansar. La tortuguita vio para todos lados y así fue como encontró un tesoro sorprendente en la mitad del bosque”. Hablar sobre el lenguaje Entre el niño y el adulto se conversaba acerca de: ¿Cuáles son los personajes de la historia? ¿Dónde ocurre esa historia? ¿Qué sucedió cuando…? Por ejemplo, “Hansel y Gretel son los niños. Ellos vivían en una casita en el campo. Cuando se perdieron se sintieron muy tristes, pero ellos hicieron un plan, encontraron una casita de chocolate, después sintieron miedo y se escaparon y luego llegaron de nuevo a su casa con sus papás”.</p><p>El niño usaba el lenguaje para hablar de situaciones imaginarias nuevas que creaba para cada uno de los personajes de las historias. Por ejemplo, “el Príncipe Ratón vivía en un castillo mágico muy pequeño. Cada vez que alguien quería entrar decía unas palabras mágicas y se volvía tan pequeñito para poder entrar”.</p><p>Secuenciación de acciones El niño identificaba secuencias de acciones al recordar las historias con ayuda de las ilustraciones e imágenes de los cuentos y libros álbum. Por ejemplo, “recuerdo que Silvestre era un burrito. Primero Silvestre le pidió a una piedrecita mágica que lo convirtiera en piedra, después sintió miedo porque ya no estaba con sus papás, luego sus papás lo buscaron y no lo encontraron, hasta que después sus papás se fueron y encontraron la piedra, ellos desearon ver a su hijo, y la piedra se convirtió en Silvestre”.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Resultados iniciales</h3>\n    <p>Empiezan resultados y categorías. Puedo mirar qué formas de lenguaje aparecen, pero debo recordar que ahora estoy construyendo un marco teórico, no todavía un estado del arte completo.</p>\n    <div class=\"bigPrompt\">Separar evidencia y conceptualización</div>\n    <div class=\"call\"><b>Esta página ocupa 3 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 3.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Resultados iniciales", "stage": "Fuente 2 · p. 10", "desc": "Separar evidencia y conceptualización.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 10 · pantalla 3/3", "page": "p. 10", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">10</span>\n    <div class=\"paperText\"><p>El niño usaba expresiones para organizar las secuencias de acciones en las historias creadas. Por ejemplo, “al inicio mi dragón verde, muy verde se escondía en las ramas de los árboles en el bosque, por eso nadie lo veía. Después mi dragón tiritaba de frío, entonces tenía que salir a buscar un refugio calientito. Cuando salía encontraba animales y les preguntaba por un lugar para cobijarse, pero nadie lo ayudaba hasta que encuentra a una familia de cerditos que lo ayudan y lo adoptan. Al final mi dragón empieza a lanzar fuego por su boca y aprende a calentar a toda la familia en la época de invierno”. Toma de un punto de vista propio El niño tuvo la oportunidad para negociar necesidades de los personajes y para expresar su propia individualidad. Por ejemplo, “a mí me gustó que Hansel era un niño muy inteligente y ayudó a su hermanita y también a su familia. Él tenía valentía, yo también soy valiente cuando ayudo a mis amigos cuando tienen problemas”.</p><p>El niño identificaba formas de expresión para tratar respetuosamente a los personajes de las historias creadas, se divertía con las situaciones que creaba. Por ejemplo, “el perro de mi historia se llama Pluto, él siempre decía por favor y gracias hasta a los que se burlaban de él. El gato se burlaba de este perrito todo el tiempo porque no había aprendido a ladrar. Pero después entendió que le dolía mucho la garganta y por eso no ladraba. Entonces ya no se burló más y lo ayudó. También descubrió que cuando daba las gracias y decía por favor algo muy bueno le pasaba”. *Fuente: Elaboración propia.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Resultados iniciales</h3>\n    <p>Empiezan resultados y categorías. Puedo mirar qué formas de lenguaje aparecen, pero debo recordar que ahora estoy construyendo un marco teórico, no todavía un estado del arte completo.</p>\n    <div class=\"bigPrompt\">Separar evidencia y conceptualización</div>\n    <div class=\"call\"><b>Esta página ocupa 3 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 3 de 3.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Resultados narrativos", "stage": "Fuente 2 · p. 11", "desc": "No confundir resultados con definición.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 11 · pantalla 1/3", "page": "p. 11", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">11</span>\n    <div class=\"paperText\"><p>La creación de historias del niño se caracterizó por la descripción se secuencias de acciones y acontecimientos realizadas por los personajes de acuerdo a una temática particular en la que se establecía causalidad. Las temáticas preferidas por el niño fueron: valentía, la necesidad de protección y la amistad. En sus temáticas había presencia de héroes y situaciones mágicas, en su gran mayoría los personajes eran animales con algún poder especial. La lectura previa de literatura infantil permitió la inclusión de situaciones o personajes a las historias nuevas. En la tabla 4 se despliegan las habilidades que se desarrollaron en el niño durante la lectura de cuentos y la creación de historias conjuntas.</p><p>Tabla 4. Habilidades narrativas que se desarrollaron en la lectura de cuentos y en la creación de historias Habilidades narrativas Lectura de cuentos Creación de historias Generación de sentidos y significados Identificación de personajes, espacio, objetos usados, acciones realizadas por los personajes, tiempo, intención. Por ejemplo, “el gato con botas era el personaje, él usaba unas botas que eran mágicas, él estaba en un lugar pequeño lleno de casitas. Este gato con botas quería siempre ayudar a su amo”.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Resultados narrativos</h3>\n    <p>El texto muestra cómo se desarrollaron las historias. Esto constituye evidencia del estudio. Puede apoyar la discusión, pero no necesito convertir todo resultado en una propiedad universal del concepto.</p>\n    <div class=\"bigPrompt\">No confundir resultados con definición</div>\n    <div class=\"call\"><b>Esta página ocupa 3 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 3.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Resultados narrativos", "stage": "Fuente 2 · p. 11", "desc": "No confundir resultados con definición.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 11 · pantalla 2/3", "page": "p. 11", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">11</span>\n    <div class=\"paperText compact\"><p>El niño tiene en cuenta diversos aspectos de una situación problema. Además, el niño utiliza nuevas combinaciones de palabras, de actitudes, de ideas y de objetos, dándoles vida al denominar de una nueva manera. Por ejemplo, Cuando el niño describe una mariposa “dudosa”. “Una mariposa dudosa siempre no sabe qué hacer o que decir, ella duda de todo. Ella está triste hasta que aprende a confiar en qué es lo que mejor sabe hacer. Cuando no sabe nada se le desaparecen sus colorcitos, pero cuando sabe algo sonríe con cara feliz y entonces sus colores de sus alitas brillan mucho”. Negociación de significados Los participantes se transforman mutuamente en la negociación de significados. Por ejemplo: Adulto: ¿recuerdas cuál fue el deseo de Silvestre? Niño: sí, que quería ser una piedra. Pero ese no fue un deseo. Adulto: ¿por qué crees que no fue un buen deseo? Niño: porque su deseo hizo que se sintiera muy triste. A mí no me gustó que se sintiera triste y que fuera piedra porque se quedó muy solito y nadie lo veía. Adulto: ¿si tú fueras Silvestre qué desearías? Niño: desearía algo que no hiciera sentir triste a nadie ni siquiera a él. Adulto: ¿qué desearías? Niño: desearía que pudiera leer contigo toda la vida, hasta el infinito. Adulto: a mí también me gusta compartir contigo estos libros. Niño: qué tal si leemos 7 libros hoy. Adulto: que tal dos. Niño: tres. Adulto: dos. Niño: está bien. Dos pero muchas veces.</p><p>El niño generó otras maneras de nombrar, de referirse a situaciones. Por ejemplo: “yo creo que con un poco de magia podemos ayudar a que las hojas de los árboles cambien de color y el viento sople muy fuerte para que el lobo vaya y ayude a hacer las casas de los cerditos. A los lobos feroces les gusta soplar y resoplar, entonces el viento le podría ayudar a construir rápido las casas de los cerditos”.</p><p>Compartir el mundo mental El niño desarrolló la habilidad de considerar la postura del otro para lograr que lo que decía fuera relevante para el otro. Por ejemplo, “</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Resultados narrativos</h3>\n    <p>El texto muestra cómo se desarrollaron las historias. Esto constituye evidencia del estudio. Puede apoyar la discusión, pero no necesito convertir todo resultado en una propiedad universal del concepto.</p>\n    <div class=\"bigPrompt\">No confundir resultados con definición</div>\n    <div class=\"call\"><b>Esta página ocupa 3 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 3.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Resultados narrativos", "stage": "Fuente 2 · p. 11", "desc": "No confundir resultados con definición.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 11 · pantalla 3/3", "page": "p. 11", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">11</span>\n    <div class=\"paperText compact\"><p>El niño consideraba la postura de cada personaje para que las historias avanzaran y se resolvieran las situaciones problema. Por ejemplo, “ Cambios en la forma de ver la experiencia Las situaciones vividas por los personajes posibilitaron que el niño analizara sus experiencias y que estableciera relaciones con sus propias experiencias de vida y que cambiara actitudes. Por ejemplo, que el niño usara la narrativa para explicar y modificar sus actitudes considerando la perspectiva del otro. “Yo ahora dibujo suavecito con mis crayones, ya no los tiro, ni los pierdo, los cuido y los comparto con mis amigos en el colegio. Ya entendí que si los uso fuerte ya no voy a poder hacer dibujos bonitos”.</p><p>La palabra posibilitó el redescubrimiento del mundo vinculando las situaciones reales con las imaginarias. Por ejemplo, “anoche soñé que era un pirata y que podía viajar en barco, ahora quiero hacer un barquito y también hacer una historia de un barquito que viajaba y viajaba a donde quería. Yo descubría un tesoro, el tesoro eran unos lápices de colores para pintar. En la navidad yo le podía regalar lápices de colores a muchos niños para que dibujen bonito así como yo dibujo”.</p><p>Planificación de acciones El niño identificó los objetivos de acción de los personajes de las historias leídas. Por ejemplo, “en la historia de atrapados este niñito quería su cometa roja y por eso lanzó con todas sus fuerzas un zapato que se quitó, un gato, una escalera y otras cosas más hasta que después se encontró con su cometa y jugó y jugó”.</p><p>El niño identificó los objetivos de actuación de los personajes de las historias que creaba. Por ejemplo, “en la historia del gato que perdió sus bigotes, muchos amigos animales le ayudaron a buscarlos hasta que los encontraron y el gatito se puso muy feliz cuando los encontró debajo de una gran roja brillante”.</p><p>*Fuente: Elaboración propia.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Resultados narrativos</h3>\n    <p>El texto muestra cómo se desarrollaron las historias. Esto constituye evidencia del estudio. Puede apoyar la discusión, pero no necesito convertir todo resultado en una propiedad universal del concepto.</p>\n    <div class=\"bigPrompt\">No confundir resultados con definición</div>\n    <div class=\"call\"><b>Esta página ocupa 3 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 3 de 3.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Imaginación y creación", "stage": "Fuente 2 · p. 12", "desc": "Entender el alcance del estudio.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 12 · pantalla 1/2", "page": "p. 12", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">12</span>\n    <div class=\"paperText compact\"><p>La imaginación en la creación de historias con frecuencia adquiría características para embellecer la realidad, introducía elementos insospechados y permitía descubrir otras posibilidades de acción e interacción entre los personajes. En la tabla 5 se presentan las habilidades de imaginación desarrolladas en el niño en la creación de historias. Tabla 5. Habilidades de imaginación en la lectura de cuentos y en la creación de historias</p><p>Habilidades de imaginación Lectura de cuentos Creación de historias Situarse desde diversas perspectivas lo que permite sentir de distintas maneras</p><p>El niño con ayuda del adulto se sintió en las perspectivas de los personajes de las historias que leía. Por ejemplo, “en dos ratones, una rata y un queso creo que los ratoncitos fueron más cuidadosos y por eso aunque tuvieron que aguantar mucha hambre, nadie se los comió”. “Yo un día también tuve que aguantar mucha hambre porque me tenían que hacer un examen especial y no podía comer nada, me sonaba mi barriguita pero no comí, hice lo que me dijeron, lloré un poquito nada más pero tuve cuidado con lo que tenía que hacer y me hicieron el examen. Después mis papás me dieron un premio y me pude comer un rico helado de vainilla”.</p><p>El niño narraba situaciones imaginarias a partir de hechos reales desde la perspectiva de los personajes que hacían parte de sus historias. Por ejemplo, “un caballo galopaba y galopaba hasta que se enfermó y ya no podía. Entonces llamó a su hijo y ahora él lo ayudaba. Un día una estrella fugaz pasó muy cerquita y entonces pidió un deseo y deseo que pudiera galopar con su hijo. Al otro día galopó y galopó y ya no se sintió más enfermo”.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Imaginación y creación</h3>\n    <p>Esta zona muestra efectos y producciones del niño. Es importante para la investigación de la autora, pero se aleja de la pregunta que me llevó a esta fuente.</p>\n    <div class=\"bigPrompt\">Entender el alcance del estudio</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Imaginación y creación", "stage": "Fuente 2 · p. 12", "desc": "Entender el alcance del estudio.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 12 · pantalla 2/2", "page": "p. 12", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">12</span>\n    <div class=\"paperText\"><p>El niño imaginaba estrategias que posibilitaban que los personajes de sus historias resolvieran problemas de manera creativa. El niño empezó a utilizar la pregunta ¿Qué pasaría si…? para ver entre diversas opciones la mejor y de esta manera ayudar a sus personajes a salir de las situaciones problema. Por ejemplo, “quisiera tener tanta fuerza para romper esos candados y cambiarlos por abrazos para el señor conejo, para el señor oso, para la señora jirafa, para el señor cien pies, pero también quisiera que todos ellos pudieran darse muchos abrazos y que ayudaran a todos los animalitos para que con la fuerza de todos siempre estén felices y bien. Entonces tendría el super poder de la fuerza”. *Fuente: Elaboración propia. Tanto en la lectura de cuentos como en la creación de historias se usó el lenguaje dialógico tanto para organizar la información como para ayudar a la reconstrucción de situaciones. El adulto durante estas interacciones ayudó al niño a participar al hacer preguntas y expandir sus expresiones. En la tabla 6
