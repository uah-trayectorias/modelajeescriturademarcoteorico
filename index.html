<script>
const steps=[{"route": "Mi investigación", "phase": "Clase anterior", "title": "Mi investigación", "stage": "Punto de partida", "desc": "Antes de leer, ubico qué problema necesito comprender.", "left": "Investigación modelo", "meta": "Caso hipotético", "page": "Panorama", "text": "<div class=\"paperTop\">INVESTIGACIÓN MODELO</div><div class=\"paperTitle\">Lectura compartida y desarrollo del lenguaje oral en Educación Parvularia</div><div class=\"paperText\">\n      <p><b>Problema:</b> leer cuentos no garantiza por sí solo oportunidades de participación oral.</p>\n      <p><b>Mi pregunta de investigación es:</b> ¿Cómo puede contribuir la lectura compartida de cuentos al desarrollo del lenguaje oral en niños y niñas de Educación Parvularia?</p>\n      <p><b>Necesidad:</b> necesito comprender qué es la lectura compartida, qué entendemos por lenguaje oral y cómo podrían relacionarse.</p>\n      <div class=\"marginNote\">No llego a los papers desde cero: llego con una pregunta que necesita conocimiento teórico.</div></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">→</div><div><b>Antes de leer, estoy pensando...</b><span>Orientar la investigación</span></div></div><h3>Mi pregunta me dice qué problema quiero comprender</h3><p>No voy a entrar a los papers “a ver qué dicen”. Primero necesito saber qué conocimiento me falta.</p><div class=\"call\"><b>Mi brújula</b><p>¿Cómo puede contribuir la lectura compartida al desarrollo del lenguaje oral?</p></div>"}, {"route": "Objetivos", "phase": "Clase anterior", "title": "Objetivos", "stage": "Retomo lo ya trabajado", "desc": "Los objetivos contienen las pistas del marco teórico.", "left": "Pregunta → objetivos", "meta": "Metodología de la clase anterior", "page": "Objetivos", "text": "<div class=\"paperTop\">DE LA PREGUNTA A LOS OBJETIVOS</div><div class=\"paperText\"><p><b>Objetivo general:</b> Analizar la relación entre las características de la lectura compartida de cuentos y las oportunidades de desarrollo del lenguaje oral en Educación Parvularia.</p><p><b>OE1:</b> Caracterizar la lectura compartida de cuentos como práctica educativa.</p><p><b>OE2:</b> Describir dimensiones relevantes del desarrollo del lenguaje oral en la primera infancia.</p><p><b>OE3:</b> Analizar de qué manera determinadas características de la lectura compartida pueden generar oportunidades para el desarrollo del lenguaje oral.</p><div class=\"marginNote\">Ahora tomo mis objetivos y aplico la metodología de la clase pasada.</div></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">→</div><div><b>Retomo lo aprendido</b><span>Objetivos → marco</span></div></div><h3>Mis objetivos contienen pistas sobre qué debo comprender</h3><p>La clase pasada usamos los objetivos para identificar conceptos, formular preguntas teóricas y planificar la búsqueda.</p><div class=\"action\"><b>Ruta</b><p>Objetivos → conceptos → preguntas teóricas → búsqueda → perspectivas → arquitectura.</p></div>"}, {"route": "Conceptos", "phase": "Clase anterior", "title": "Conceptos centrales", "stage": "Metodología anterior · Paso 1", "desc": "Selecciono conceptos cuyo significado cambia la investigación.", "left": "Objetivos → conceptos", "meta": "Aplicación de la metodología anterior", "page": "Paso 1", "text": "<div class=\"paperTop\">DETECTOR DE CONCEPTOS</div><div class=\"paperText\"><p class=\"objective\">Analizar la relación entre las características de la <span class=\"hl\">lectura compartida</span> de cuentos y las oportunidades de desarrollo del <span class=\"hl2\">lenguaje oral</span> en Educación Parvularia.</p><p><span class=\"marker\">Lectura compartida</span><span class=\"marker\">Lenguaje oral</span><span class=\"marker\">Relación entre ambos</span></p><div class=\"marginNote\">Prueba: si entendiera este concepto de otra manera, ¿cambiaría la investigación?</div></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">1</div><div><b>Metodología de la clase anterior</b><span>Identificar conceptos</span></div></div><h3>No marco todas las palabras: elijo las que sostienen la investigación</h3><p>En este caso: lectura compartida, lenguaje oral y la relación entre ambos.</p>"}, {"route": "Preguntas teóricas", "phase": "Clase anterior", "title": "Preguntas teóricas", "stage": "Metodología anterior · Paso 2", "desc": "Convierto conceptos amplios en necesidades de conocimiento.", "left": "Concepto → preguntas", "meta": "Aplicación de la metodología anterior", "page": "Paso 2", "text": "<div class=\"paperTop\">CONCEPTO: LECTURA COMPARTIDA</div><div class=\"paperText\"><p>¿Qué se entiende por lectura compartida?</p><p>¿Qué características la distinguen de otras formas de lectura de cuentos?</p><p>¿Qué papel cumple la interacción entre adulto y niños?</p><p>¿Qué tipos de mediación aparecen durante la lectura?</p><div class=\"marginNote\">Estas preguntas me permitirán discriminar qué información necesito de los textos.</div></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">2</div><div><b>Metodología de la clase anterior</b><span>Problematizar el concepto</span></div></div><h3>No busco todavía: primero formulo qué necesito saber</h3><p>Una pregunta teórica me permite entrar a un artículo con propósito.</p>"}, {"route": "Búsqueda", "phase": "Clase anterior", "title": "Estrategia de búsqueda", "stage": "Metodología anterior · Paso 3", "desc": "Traduzco mis preguntas a combinaciones de búsqueda.", "left": "Pregunta → búsqueda", "meta": "Aplicación de la metodología anterior", "page": "Paso 3", "text": "<div class=\"paperTop\">PREGUNTA TEÓRICA</div><div class=\"paperText\"><p><b>¿Qué se entiende por lectura compartida y qué características la distinguen?</b></p><p><span class=\"marker\">lectura compartida definición</span><span class=\"marker\">lectura compartida educación inicial</span><span class=\"marker\">lectura dialógica educación infantil</span></p><p>Espero localizar textos que me permitan <span class=\"hl\">definir, caracterizar, comparar o relacionar</span>.</p><div class=\"marginNote\">No busco información “sobre el tema”: busco conocimiento que responda una pregunta.</div></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">3</div><div><b>Metodología de la clase anterior</b><span>Diseñar búsqueda</span></div></div><h3>La búsqueda tiene una función</h3><p>Necesito fuentes que conceptualicen la lectura compartida y desarrollen su dimensión interactiva.</p>"}, {"route": "Arquitectura", "phase": "Clase anterior", "title": "Arquitectura inicial", "stage": "Producto de la clase anterior", "desc": "Sé qué apartados debo construir antes de empezar a redactar.", "left": "Arquitectura del marco teórico", "meta": "Punto de llegada de la clase anterior", "page": "Plan", "text": "<div class=\"paperTop\">MARCO TEÓRICO</div><div class=\"paperText\"><p><b>1. Lectura compartida en Educación Parvularia</b><br>¿Qué es? ¿Qué la caracteriza? ¿Qué papel cumple la interacción?</p><p><b>2. Desarrollo del lenguaje oral en la primera infancia</b><br>¿Qué dimensiones incluye? ¿Qué papel cumplen las interacciones?</p><p><b>3. Lectura compartida y oportunidades de lenguaje oral</b><br>¿Cómo podrían relacionarse ambos conceptos?</p><div class=\"marginNote\">Sé qué necesito construir. Ahora tengo que leer para decidir qué voy a sostener.</div></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">5</div><div><b>Producto de la clase anterior</b><span>Arquitectura</span></div></div><h3>Este es el punto exacto donde empieza la lectura inmersiva</h3><p>Ahora veremos el artículo completo, pero no lo leeremos todo con la misma intensidad.</p><div class=\"warning\"><b>Lo importante</b><p>También voy a explicar por qué algunas partes NO las extraigo y qué función cumplen dentro del artículo.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Entrada y resumen", "stage": "Fuente 1 · p. 151", "desc": "Confirmar pertinencia.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 151 · pantalla 1/2", "page": "p. 151", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">151</span>\n    <div class=\"paperText\"><p>MONOGRÁFICO / MONOGRÁFICO</p><p>LECTURA COMPARTIDA Y ESTRATEGIAS DE COMPRENSIÓN LECTORA EN EDUCACIÓN INFANTIL</p><p>María Teresa Llamazares Prieto; María Dolores Alonso-Cortés Fradejas *</p><p>SÍNTESIS. Hoy en día, la lectura de cuentos es una práctica habitual en las aulas de Educación Infantil. Casi a diario, los niños se sientan en la zona destinada a la biblioteca de aula y disfrutan escuchando las narraciones que en voz alta lee su maestra. Es indudable que esta actividad contribuye a que los aprendices desarrollen el gusto por leer y se familiaricen con la lengua escrita, pero ¿hasta qué punto se aprovecha la situación para que los niños aprendan a ser lectores activos y estratégicos? Convencidas de que puede obtenerse mucho más rendimiento de esta agradable rutina, en este trabajo mostramos cómo la lectura de cuentos puede convertirse en una oportunidad para enseñar estrategias de lectura y, por lo tanto, para desarrollar, ya desde una edad temprana, las habilidades de comprensión lectora. Para ello, tras delimitar un marco conceptual, proponemos una secuencia didáctica de lectura compartida y dialógica y la ilustramos con ejemplos de una implementación llevada a cabo en un aula con niños de 4 y 5 años.</p><p>151 151</p><p>Palabras clave: lectura compartida; libros grandes; comprensión lectora; estrategias.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Primero hago barrido</span></div></div>\n    <h3>Entrada y resumen</h3>\n    <p>El título y el resumen me permiten decidir si el artículo puede responder mis preguntas. Aquí leo con atención suficiente para decidir si entro, pero todavía no extraigo una idea para el marco.</p>\n    <div class=\"bigPrompt\">Confirmar pertinencia</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Entrada y resumen", "stage": "Fuente 1 · p. 151", "desc": "Confirmar pertinencia.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 151 · pantalla 2/2", "page": "p. 151", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">151</span>\n    <div class=\"paperText\"><p>Leitura partilhada e estratégias de compreensão de texto em Edu­ cação Infantil SÍNTESE. Hoje em dia, a leitura de contos é uma prática habitual nas salas de aula de Educação Infantil. Quase diariamente, as crianças sentam-se na zona destinada à biblioteca da sala e usufruem escutando as narrações que a sua educadora lê em voz alta. Não restam dúvidas de que esta atividade contribui para que os aprendizes desenvolvam o gosto pela leitura e se familiarizem com a língua escrita, mas até que ponto se tira partido desta situação para que as crianças aprendam a ser leitores ativos e estratégi­ cos? Convencidas de que é possível obter muito mais rendimento desta agradável rotina, neste trabalho mostramos como a leitura de contos se pode transformar numa oportunidade para ensinar estratégias de leitura e, portanto, para desenvolver, a partir de uma idade precoce, as capacidades de compreensão da leitura. Para tal, após delimitar um quadro concep­ tual, propomos uma sequência didática de leitura partilhada e dialógica,</p><p>* Departamento de Filología Hispánica y Clásica. Universidad de León, España.</p><p>recibido / recebedo: 30/01/2016; aceptado / aceite: 20/04/2016</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Primero hago barrido</span></div></div>\n    <h3>Entrada y resumen</h3>\n    <p>El título y el resumen me permiten decidir si el artículo puede responder mis preguntas. Aquí leo con atención suficiente para decidir si entro, pero todavía no extraigo una idea para el marco.</p>\n    <div class=\"bigPrompt\">Confirmar pertinencia</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Marco inicial", "stage": "Fuente 1 · p. 152", "desc": "Ubicar el campo.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 152 · pantalla 1/2", "page": "p. 152", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">152</span>\n    <div class=\"paperText\"><p>e ilustramo-la com exemplos de uma implementação levada a cabo numa sala de aula com crianças de 4 e 5 anos.</p><p>Palavras-chave: leitura partilhada; livros grandes; compreensão da leitura; estratégias.</p><p>Shared reading and reading comprehension strategies in kindergarten ABSTRACT. Today, the storytelling is a common practice in kindergarten classrooms. Almost daily, the children sit in the area for the classroom library and enjoy listening to stories which are read aloud by their teachers. Clearly, this activity helps learners develop a love for reading and to familiarize themselves with the written language. However, we wonder if it usually well exploited so that children can learn to be active and strategic readers. Since we firmly believe that more profit can be taken of this pleasant routine, in this paper we try to show how storytelling can become an opportunity to teach reading strategies and, therefore, to develop, from an early age, reading comprehension skills. For this purpose, after defining a conceptual framework, a didactic sequence for shared reading with big book is proposed and it is as well illustrated with examples of and implementation held in a classroom with children aged 4 and 5 years.</p><p>Keywords: shared reading; big books; reading comprehension; strategies instruction.</p><p>152 152</p><p>1. INTRODUCCIÓN</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Marco inicial</h3>\n    <p>Esta zona sitúa la lectura compartida dentro de la alfabetización emergente. Cumple una función de contextualización. La necesito para comprender desde dónde hablan las autoras, pero todavía no responde directamente qué caracteriza la práctica.</p>\n    <div class=\"bigPrompt\">Ubicar el campo</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Marco inicial", "stage": "Fuente 1 · p. 152", "desc": "Ubicar el campo.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 152 · pantalla 2/2", "page": "p. 152", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">152</span>\n    <div class=\"paperText\"><p>Nuestra propuesta se enmarca dentro de lo que se conoce como alfabetización emergente, es decir, dentro de una serie de conductas de lectura y escritura de los niños pequeños que preceden a la alfabetización convencional y que luego evolucionarán hacia ella. Es un proceso que compromete a las habilidades, conocimientos y actitudes que se suponen precursores del desarrollo de las formas convencionales de leer y escribir (Sulzby y Teale, 1991) y que incluye habilidades como el conocimiento de las letras, la conciencia fonológica y las destrezas lingüísticas orales (Lonigan y Whitehurst, 1998). Los estudios de alfabetización emergente ya demos­ traron hace años que la alfabetización no solo ocurre en el aula, sino que se realiza también en la familia, en la calle y en otros contextos no escolares con todos los materiales escritos y prácticas letradas que se encuentran en el entorno del individuo (Purcell-Gates, 2001; Teale y Sulzby, 1986). Con todo, son las prácticas pedagógicas sistemáticas de los educadores las que deben garantizar la adquisición de los conocimientos que entran en juego cuando se lee para acceder al sentido de los textos y cuando se escribe para producir textos con sentido.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Marco inicial</h3>\n    <p>Esta zona sitúa la lectura compartida dentro de la alfabetización emergente. Cumple una función de contextualización. La necesito para comprender desde dónde hablan las autoras, pero todavía no responde directamente qué caracteriza la práctica.</p>\n    <div class=\"bigPrompt\">Ubicar el campo</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Conceptualización", "stage": "Fuente 1 · p. 153", "desc": "Aquí sí me detengo.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 153 · pantalla 1/2", "page": "p. 153", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">153</span>\n    <div class=\"paperText compact\"><p>Dentro de las prácticas de alfabetización emergente una de las que se ha demostrado más beneficiosa es la lectura compartida. En el ámbito familiar se asocia con la denominada lectura en el regazo y hay una amplia tradición de estudios que han puesto de manifiesto su papel sumamente significativo en el desarrollo cognitivo temprano en general y lingüístico en particular, dado que gracias a ella los niños adquieren habilidades y herra­ mientas previas importantes para una posterior decodificación, ortografía y comprensión lectora (Wells, 1985; Payne, Whitehurst y Angell, 1994; Callaghan y Madelaine, 2012). Distintas investigaciones han demostrado, así, que las experiencias familiares de lectura compartida con libro ilustrado incrementan el vocabulario de los preescolares (Sénéchal y Cornell, 1993; Sénéchal, Thomas y Monker, 1995; Vivas, 1996), la complejidad en el len­ guaje oral (McNeill y Fowler, 1999) y las habilidades narrativas (Zevenbergen y Wilson, 1996). Algunos estudios también sugieren que hay una relación entre las experiencias tempranas de lectura compartida con libro ilustrado y las habilidades posteriores relacionadas con el lenguaje y la alfabetización (Dickinson y Smith, 1994). Por ejemplo, Wells (1985) mostró que la cantidad de tiempo que los niños de entre 1 y 3 años pasaban escuchando historias estaba significativamente relacionada con sus destrezas lingüísticas a los 5 años y con su comprensión lectora a los 7 años. Del mismo modo, Stevenson y Fredman (1990) encontraron una relación significativa entre la frecuencia de lectura compartida entre padres e hijos en edad preescolar y su nivel de lectura y ortografía y su puntuación de coeficiente intelectual a los 13 años.</p><p>153 153</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Aquí bajo la velocidad</span></div></div>\n    <h3>Conceptualización</h3>\n    <p>Aparece una definición de lectura compartida escolar y una distinción frente a otras situaciones de lectura en voz alta. Esta zona cumple una función conceptual directa para mi apartado.</p>\n    <div class=\"bigPrompt\">Aquí sí me detengo</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div><div class=\"action\"><b>Lo que estoy buscando</b><p>Definición + diferencia con otras formas de lectura + papel de la interacción.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Conceptualización", "stage": "Fuente 1 · p. 153", "desc": "Aquí sí me detengo.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 153 · pantalla 2/2", "page": "p. 153", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">153</span>\n    <div class=\"paperText\"><p>En las aulas son situaciones de lectura compartida aquellas en las que <span class=\"hl\">el maestro y los alumnos cooperan en la tarea de leer y de aprender</span>, utilizando un texto que está a la vista de todos. Se diferencian de otras situa­ ciones de lectura en voz alta por el hecho de tratarse de <span class=\"hl2\">situaciones dialógicas</span>, es decir, de situaciones en las que los alumnos <span class=\"underline\">participan interaccionando entre ellos y con el docente</span>, a iniciativa de este o motu proprio, para hacer preguntas y dar respuestas acerca de lo que leen y mientras leen. Desde que Whitehurst, Falco, Lonigan, Fischel, De Baryshe, Valdez-Menchaca y Caulfield (1988) acotasen el concepto de lectura dialógica por primera vez, se han realizado numerosos estudios de intervención que también han revelado que, frente a los niños que solo participan en situaciones de lectura en voz alta convencionales, los niños que participan en situaciones escolares de lectura compartida disfrutan de un amplio catálogo de beneficios. Así, por ejemplo, aprenden más vocabulario (Hargrave y Sénechal, 2006) y sus construcciones narrativas son mejores y mejor contextualizadas (Lever y Sénéchal, 2011).</p><p>Por otra parte, se han apreciado efectos positivos sobre sus habili­ dades de expresión y comprensión oral (Lonigan, Anthony, Bloomfield, Dyer y Samwel, 1999) así como sobre su nivel de conocimiento alfabético, su sensibilidad fonológica y su conciencia ortográfica (Mol, Bus y De Jong, 2009).</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Aquí bajo la velocidad</span></div></div>\n    <h3>Conceptualización</h3>\n    <p>Aparece una definición de lectura compartida escolar y una distinción frente a otras situaciones de lectura en voz alta. Esta zona cumple una función conceptual directa para mi apartado.</p>\n    <div class=\"bigPrompt\">Aquí sí me detengo</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div><div class=\"action\"><b>Lo que estoy buscando</b><p>Definición + diferencia con otras formas de lectura + papel de la interacción.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Condiciones de la práctica", "stage": "Fuente 1 · p. 154", "desc": "Seleccionar dentro de una página densa.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 154 · pantalla 1/2", "page": "p. 154", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">154</span>\n    <div class=\"paperText\"><p>Para que la lectura compartida dialógica pueda ser considerada una práctica didáctica efectiva, se ha visto que debe realizarse con grupos pequeños, que debe repetirse con el mismo texto varias veces, que debe incluir instrucción sobre el vocabulario y que debe incluir preguntas que trasciendan la información literal con el fin de conectar ideas y captar el sentido de los textos (Doyle y Bramwell, 2006). Asimismo, diferentes investigaciones han revelado que, a fin de generar beneficios en el desarrollo del lenguaje y en el conocimiento de lo impreso, han de tenerse en cuenta los siguientes factores: 1. Frecuencia: para que pueda contribuir significativamente al desarrollo lingüístico y comunicativo, la lectura compartida ha de ser una práctica fre­ cuente. 2. Edad: se ha visto que ya desde los 14 meses puede tener efecto. 3. Características de los libros: la lectura compartida de libros con letras grandes, pocas palabras por página e ilustraciones relacionadas con el texto resulta más eficaz. 4. Interacción: <span class=\"hl\">el docente debe ser capaz de poner en práctica una serie de estrategias interactivas</span> (Goikoetxea y Martínez, 2015).</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Aquí bajo la velocidad</span></div></div>\n    <h3>Condiciones de la práctica</h3>\n    <p>La página reúne varias condiciones para que la lectura compartida sea efectiva. No necesito todas por igual: interacción y ajuste docente profundizan mi concepto; frecuencia, edad o características del libro pueden servir en otros desarrollos.</p>\n    <div class=\"bigPrompt\">Seleccionar dentro de una página densa</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div><div class=\"warning\"><b>Discriminación</b><p>Algunas condiciones pueden ser importantes para el artículo, pero no todas cumplen la misma función en mi apartado teórico.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Condiciones de la práctica", "stage": "Fuente 1 · p. 154", "desc": "Seleccionar dentro de una página densa.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 154 · pantalla 2/2", "page": "p. 154", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">154</span>\n    <div class=\"paperText compact\"><p>De todas estas características, esta última nos parece especialmente relevante puesto que la importancia que las interacciones alcanzan en los procesos cognitivos de aprendizaje es sobradamente conocida (Bruner, 1995). Por lo que respecta al aprendizaje inicial de la lectura y la escritura, se ha comprobado que las interacciones que se producen entre madres y sus hijos en momentos de lectura compartida generan valiosos conocimientos sobre el lenguaje y sobre las estructuras de participación en la cultura escrita (Hind­ man, Skibbe y Foster, 2014). Sin embargo, tal y como concluye Arias (2014) en un estudio de revisión, las interacciones que se dan entre los adultos y los niños en este tipo de situaciones de lectura parecen estar fuertemente mediadas por el nivel de desarrollo de enunciados lingüísticos complejos en el niño y por <span class=\"underline\">la capacidad del adulto para acomodarse a sus respuestas en cada momento</span>. Por esta razón, nuestra propuesta pone el énfasis en el desarrollo consciente de un comportamiento interactivo mediador efectivo.</p><p>154 154</p><p>Asimismo, y puesto que numerosos estudios de intervención han demostrado que las prácticas de comprensión lectora más efectivas son aquellas que incluyen instrucción explícita de estrategias de lectura (Ripoll y Aguado, 2014), sugerimos centrar la interacción con los niños en el entre­ namiento, antes, durante y después de la lectura, de varias de ellas: activa­ ción de conocimientos previos, realización de inferencias y monitorización o autorregulación del proceso de comprensión.</p><p>Se han encontrado innumerables evidencias de que el nivel de conocimientos previos predice la comprensión lectora (McNamara, Kintsch, Songer y Kintsch, 1996; Samuelstuen y Bråten, 2005; McNamara, Ozuru y Floyd, 2011) y de que la activación de este tipo de conocimientos tiene un efecto beneficioso sobre la capacidad de comprensión de textos (Kostons y</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Aquí bajo la velocidad</span></div></div>\n    <h3>Condiciones de la práctica</h3>\n    <p>La página reúne varias condiciones para que la lectura compartida sea efectiva. No necesito todas por igual: interacción y ajuste docente profundizan mi concepto; frecuencia, edad o características del libro pueden servir en otros desarrollos.</p>\n    <div class=\"bigPrompt\">Seleccionar dentro de una página densa</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div><div class=\"warning\"><b>Discriminación</b><p>Algunas condiciones pueden ser importantes para el artículo, pero no todas cumplen la misma función en mi apartado teórico.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Puente hacia comprensión lectora", "stage": "Fuente 1 · p. 155", "desc": "Reconocer un desplazamiento del artículo.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 155 · pantalla 1/2", "page": "p. 155", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">155</span>\n    <div class=\"paperText\"><p>Van der Werf, 2015). No obstante, distintas investigaciones realizadas en el ámbito escolar también han evidenciado que los docentes no siempre se detienen a activar, antes de la lectura, los conocimientos de los que los niños ya disponen (Llamazares, Ríos y Buisán, 2013).</p><p>Igualmente crucial para la comprensión lectora es la capacidad de realizar inferencias (Oakhill y Cain, 2012), es decir, la capacidad de ir más allá de lo que el texto dice (significado literal) para llegar a lo que el texto quiere decir (significado implícito) y hay un amplio conjunto de estudios que han probado que los niños pueden desenvolverse en el procesamiento inferencial ya a corta edad (Van den Broek et al., 2005). Sin embargo, con frecuencia, en el ámbito escolar se retrasa el entrenamiento de este tipo de habilidades hasta que la mecánica de la descodificación está dominada.</p><p>Por último, consideramos que es necesario prestar especial atención a la denominada autorregulación, es decir, a la capacidad que tiene el lector de autointerrogarse para comprobar hasta qué punto está comprendiendo lo que lee. Como las anteriores, es una capacidad que predice la comprensión lectora (Birgisdóttir, Gestsdóttir y Thorsdóttir, 2015) y se han mostrado los beneficios de entrenarla en los escolares (Joseph, Alber-Morgan, Cullen y Rouse, 2015), pero tampoco es frecuente que se trabaje en las aulas.</p><p>155 155</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Puente hacia comprensión lectora</h3>\n    <p>El texto comienza a desplazarse hacia estrategias de comprensión y efectos escolares. Es importante para el propósito general del artículo, pero se aleja de mi pregunta inmediata de definición. Leo para entender el recorrido, no para extraer ahora.</p>\n    <div class=\"bigPrompt\">Reconocer un desplazamiento del artículo</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Puente hacia comprensión lectora", "stage": "Fuente 1 · p. 155", "desc": "Reconocer un desplazamiento del artículo.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 155 · pantalla 2/2", "page": "p. 155", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">155</span>\n    <div class=\"paperText\"><p>Desde nuestro punto de vista, las situaciones de lectura compartida dialógicas son idóneas para el desarrollo de dichas estrategias en Educación Infantil: propician que los expertos y los aprendices pongan en común lo que saben sobre el tema del que trata el texto (Pearson y Hansen, 1983) y sobre los propios materiales impresos (Justice y Kaderavek, 2002) y se ha visto que con este tipo de prácticas los maestros pueden llegar a implicar a sus alumnos en conversaciones con un alto nivel inferencial, incluso en la etapa preescolar (Van Kleeck, 2008; Zucker, Justice, Piasta y Kaderavek, 2010). Además, al tratarse de situaciones durante las que se fomenta el pensamiento en voz alta, pueden ofrecer numerosas oportunidades de que el lector detecte sus dificultades y se plantee la manera de salvar obstáculos de comprensión. Ahora bien, no sin una instrucción explícita por parte del docente. Así pues, nuestra propuesta contempla también la utilización de algunas de las técnicas que se han probado más eficaces para ello: el mo­ delado, el cuestionamiento, la introspección y el andamiaje.</p><p>El cuestionamiento o formulación de preguntas es, con seguridad, el método de instrucción de estrategias más frecuente y conscientemente utilizado. Aplicado a la instrucción de estrategias durante los procesos de comprensión lectora, supone indagar no tanto para comprobar qué están comprendiendo o cómo están escribiendo los alumnos, sino para ayudarles a articular las diversas clases de conocimiento (Beltrán, 1996). No obstan­</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Puente hacia comprensión lectora</h3>\n    <p>El texto comienza a desplazarse hacia estrategias de comprensión y efectos escolares. Es importante para el propósito general del artículo, pero se aleja de mi pregunta inmediata de definición. Leo para entender el recorrido, no para extraer ahora.</p>\n    <div class=\"bigPrompt\">Reconocer un desplazamiento del artículo</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Estrategias de comprensión", "stage": "Fuente 1 · p. 156", "desc": "Entender sin sobrecargar mi apartado.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 156 · pantalla 1/2", "page": "p. 156", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">156</span>\n    <div class=\"paperText compact\"><p>te, tal y como señalan Duke y Pearson (2002), el tipo de preguntas que los docentes hacen a los aprendices determinará la clase de preguntas que se plantearán cuando lean autónomamente: si reciben constantes preguntas sobre los detalles literales de los textos, cuando se enfrenten a ellos por sí solos, tenderán a centrarse en los detalles; si, por el contrario, las preguntas que se les formulan les obligan a conectar la información que aparece dis­ persa en el texto, en el futuro se centrarán en la integración de significados.</p><p>El modelado es el esfuerzo que realiza el profesor para explicitar qué es lo que piensa y hace en el momento de resolver una determinada tarea cognitiva (Monereo, Pozo y Castelló, 2001). Ha sido incluido desde hace años en numerosos programas y modelos de instrucción de estrategias de com­ prensión lectora con resultados altamente positivos (Kucan y Beck, 1997) y supone «pensar en voz alta», mostrar a los aprendices no solo los pasos que está siguiendo como lector o escritor experto, sino también explicar el porqué de cada decisión tomada, de cada estrategia aplicada. Dicho de otra manera, implica la verbalización y exteriorización de los procesos de pensamiento y de autorregulación llevados a cabo por el docente, permitiendo que los niños observen cómo se construye la comprensión de textos.</p><p>El andamiaje, por su parte, se refiere al apoyo que un experto su­ ministra a un aprendiz inexperto para ayudarle a realizar una tarea y que ha de ir retirándose gradualmente a medida que el alumno vaya siendo capaz de realizarla por sí mismo (Bruner, 1983; Beltrán, 1996). Según apuntan Ankrum, Genest y Belcastro (2014), es un elemento distintivo de las prácticas efectivas de comprensión lectora y, aplicado a la instrucción de estrategias de comprensión lectora, supone saber adoptar un papel mediador para pro­ porcionar inmediatamente una solución sin pistas, ayudas o sugerencias que indiquen a los aprendices cómo continuar comprendiendo.</p><p>156 156</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Estrategias de comprensión</h3>\n    <p>Aquí las autoras desarrollan preguntas y estrategias lectoras. Puede servir más adelante para caracterizar mediaciones concretas, pero no necesito llevar todo al apartado conceptual. Registro la posibilidad y sigo.</p>\n    <div class=\"bigPrompt\">Entender sin sobrecargar mi apartado</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Estrategias de comprensión", "stage": "Fuente 1 · p. 156", "desc": "Entender sin sobrecargar mi apartado.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 156 · pantalla 2/2", "page": "p. 156", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">156</span>\n    <div class=\"paperText\"><p>Finalmente, la introspección requiere, como el modelado, la ex­ plicitación de los procesos de pensamiento, también a medida que se va realizando la tarea, pero, en este caso, por parte del aprendiz. Como señalan Monereo, Pozo y Castelló (2001), quienes lo denominan análisis de casos de pensamiento, este método de instrucción de estrategias permite un diálogo abierto sobre las distintas formas en que los niños resuelven un determinado reto cognitivo y la identificación de los conocimientos previos que están ac­ tivando. Aplicado a la instrucción de estrategias de lectura, supone permitir que los aprendices reflexionen en voz alta sobre los pasos y decisiones que han tomado para producir significados por escrito o para acceder al sentido de un texto. Se ha demostrado que cuando se fomenta que los alumnos piensen en voz alta durante los procesos de lectura, mejora su capacidad de resumir</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Estrategias de comprensión</h3>\n    <p>Aquí las autoras desarrollan preguntas y estrategias lectoras. Puede servir más adelante para caracterizar mediaciones concretas, pero no necesito llevar todo al apartado conceptual. Registro la posibilidad y sigo.</p>\n    <div class=\"bigPrompt\">Entender sin sobrecargar mi apartado</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Metacognición y estrategias", "stage": "Fuente 1 · p. 157", "desc": "Distinguir nivel de detalle.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 157 · pantalla 1/2", "page": "p. 157", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">157</span>\n    <div class=\"paperText\"><p>el contenido de un texto (Silven y Vauras, 1992), así como su capacidad de autorregulación de la comprensión lectora (Baumann, Seifert-Kessell y Jones, 1992).</p><p>Se trata, en resumen, de proporcionar a los aprendices algunas de las condiciones que se consideran garantía de la instrucción efectiva de estrategias (Duke y Pearson, 2002): tiempo y esfuerzos dedicados no solo a la mecánica, sino también a los procesos de lectura; experiencias reales en los que se vean implicados con objetivos comunicativos auténticos; discusión sobre el vocabulario, y, sobre todo, un ambiente rico en interacciones de calidad en torno a los textos que se leen.</p><p>En último término, nuestra propuesta pretende ser coherente con una perspectiva constructivista del aprendizaje de la lectura y de la escritura. El aprendizaje de la lengua escrita no se logra (solo) a través de actividades repetitivas y descontextualizadas como la copia y la enseñanza de letras aisladas, sino a través de situaciones de aprendizaje interesantes y significativas en las que, ya en la etapa de Educación Infantil, los niños aprendan a leer comprendiendo textos y aprendan a escribir componiendo textos. Se trata de promover un aprendizaje más efectivo que posibilite que los educandos lleguen a utilizar la lengua escrita como una herramienta que les permita no solo registrar y acceder a información, sino también generar nuevo conocimiento (Colomer y Camps, 1996).</p><p>157 157</p><p>2. ROCEDIMIENTO 2.1 ELECCIÓN DEL TEXTO</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Metacognición y estrategias</h3>\n    <p>El artículo sigue profundizando estrategias de comprensión. Esta información muestra cómo se operacionaliza la lectura compartida, pero su nivel de detalle excede lo que necesito para definir el concepto.</p>\n    <div class=\"bigPrompt\">Distinguir nivel de detalle</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Metacognición y estrategias", "stage": "Fuente 1 · p. 157", "desc": "Distinguir nivel de detalle.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 157 · pantalla 2/2", "page": "p. 157", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">157</span>\n    <div class=\"paperText\"><p>El texto que hemos escogido es un cuento titulado El tonto de mi pueblo (Almodóvar, 1986). En él, una misma acción se repite, con ligeras variaciones, tres veces, muestra de la permanencia de una estructura narrativa de tipo oral: cuando la cultura se transmitía de forma oral, había que repetir constantemente el conocimiento que se había adquirido, de lo contrario se habría perdido. Por eso, la estructura narrativa de los cuentos populares tiende a ser redundante: tres cosas que vender, tres hijos que deben mostrar su valía al rey, tres pruebas que superar… A falta de un texto escrito al que engancharse, el narrador debía recapitular frecuentemente aquello que ya se había dicho para refrescar su memoria y la del público, facilitando de este modo la comprensión del cuento. Los educandos de Educación Infantil, a los que va dirigida esta secuencia, están también en esa situación en que la oralidad es su principal instrumento para adquirir conocimientos.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Metacognición y estrategias</h3>\n    <p>El artículo sigue profundizando estrategias de comprensión. Esta información muestra cómo se operacionaliza la lectura compartida, pero su nivel de detalle excede lo que necesito para definir el concepto.</p>\n    <div class=\"bigPrompt\">Distinguir nivel de detalle</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Método y participantes", "stage": "Fuente 1 · p. 158", "desc": "Cambiar el modo de lectura.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 158 · pantalla 1/1", "page": "p. 158", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">158</span>\n    <div class=\"paperText compact\"><p>2.2 PARTICIPANTES</p><p>La implementación de la sesión de lectura compartida fue llevada a cabo en una clase de Educación Infantil de un colegio público urbano. La interacción se produjo entre una maestra de Educación Infantil, entrenada tanto en el uso de estrategias de comprensión lectora como en la puesta en práctica de técnicas de modelado, cuestionamiento, introspección y anda­ miaje, y el alumnado, compuesto por cinco niños de 5 años y siete de 4 años.</p><p>2.3 INSTRUMENTO</p><p>Para la ocasión se elaboró, de forma artesanal, un «libro grande» (o big book). Los «libros grandes» son versiones de los libros destinados a los niños cuya característica distintiva es el tamaño, puesto que cada página ocupa media cartulina. De igual modo, el tamaño de las letras que componen el texto es muy grande y se acompaña de una ilustración acorde que per­ miten a los niños centrarse en el libro. Consideramos que la utilización del «libro grande» es la forma más parecida de reproducir en el aula la lectura compartida que se realiza en el seno familiar entre padres e hijos, ya que un libro de este tamaño permite a todo el grupo-clase ver y reaccionar ante las palabras, expresiones o imágenes que aparecen en la página que el docente lee en voz alta. Un texto ampliado de esta manera permite a los educandos seguir exactamente lo que la maestra está mostrándoles: su proceso de pen­ samiento, sus intentos de obtener el significado del texto, así como la lectura de palabras y frases, especialmente de palabras claves que se destacaron en la elaboración del cuento.</p><p>158 158</p><p>El texto que acompaña a cada imagen es una adaptación del reco­ gido por Almodóvar, en la que se eliminan detalles prolijos del narrador y se conserva lo esencial de los diálogos para que la acción pueda avanzar y ser comprendida. Lo que sigue es la versión adaptada del cuento para elaborar el libro grande. Nos interesa señalar los fragmentos de cada página con el fin de indicar, posteriormente, en qué punto podemos apoyarnos para poner en marcha una estrategia de comprensión lectora.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Método y participantes</h3>\n    <p>Entramos a la descripción de participantes y de la implementación. Para construir el marco teórico, no necesito extraer esta información como definición. Sí la observo para saber qué tipo de trabajo sustenta las afirmaciones posteriores.</p>\n    <div class=\"bigPrompt\">Cambiar el modo de lectura</div>\n    "}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Material de trabajo", "stage": "Fuente 1 · p. 159", "desc": "Reconocer una función metodológica.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 159 · pantalla 1/2", "page": "p. 159", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">159</span>\n    <div class=\"paperText compact\"><p>Frag­ mento Texto</p><p>Título: El tonto de mi pueblo</p><p>Portada</p><p>Ilustración: Una choza, un jamón, una cabrita, un recipiente con un líquido.</p><p>Había una vez en mi pueblo un tonto que vivía con su madre en una choza por­ que eran muy pobres. Para ayudarles, un día les regalaron un jamón y decidieron venderlo para conseguir algún dinero:</p><p>— —Mira, Juan, llévate el jamón a la plaza, antes de que le metamos mano, y</p><p>ponte a pregonarlo.</p><p>Por el camino, los perros de los cortijos cercanos olieron el jamón y pegaban saltos alrededor de Juan:</p><p>— —Conque queréis el jamón. Está bien. Os lo vendo a vosotros; así me ahorro la</p><p>caminata hasta el pueblo. El jueves que viene pasaré a cobrarlo. Ni corto ni perezoso, les dejó allí el jamón y se volvió a la choza.</p><p>Al verlo, le dijo su madre:</p><p>— —¿Ya estás de vuelta, Juan? ¿Y el jamón?</p><p>— —El jamón ya está vendido. Pero como no llevaban dinero encima, hemos que­</p><p>dado en que el jueves que viene me lo pagarán. A la madre no le gustó ni mucho ni poco aquella explicación, pero qué iba a hacerle, si su hijo era tonto.</p><p>El jueves, Juan se acercó al primer cortijo y el perro le empezó a ladrar.</p><p>— —¿Esas tenemos? ¿Así me recibes en vez de pagarme lo que me debes? Pues te</p><p>vas a enterar. Le dio un cachiporrazo al animal que empezó a aullar y salió el amo.</p><p>159 159</p><p>— —¿Qué pasa?</p><p>— —Pasa que su perro no me quiere pagar los cinco duros del jamón.</p><p>El hombre se dio cuenta de que era tonto y le dio los cinco duros. Lo mismo hizo Juan en los demás cortijos y le pagaron cinco duros por cada perro.</p><p>Cuando volvió Juan a su casa con tanto dinero, su madre se puso muy contenta y pensó que a lo mejor no era tan tonto.</p><p>Al día siguiente, la madre le dijo:</p><p>— —Mira Juan, ahora vas a ir a vender esta cabrita que nos han regalado.</p><p>— —De acuerdo, madre. Y allá va Juan tirando de su cabrita con una cuerda. Al pasar por delante de una iglesia, vio que entraba y salía mucha gente. Y se metió con la cabra gritando:</p><p>— —¿Quién me compra esta cabrita? ¿Quién me compra esta cabrita? Se reían porque era tonto, pero nadie se la compraba.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Material de trabajo</h3>\n    <p>La tabla y los fragmentos del cuento documentan el material usado en la implementación. Son esenciales para reproducir o comprender el estudio, pero no para responder mi pregunta conceptual actual.</p>\n    <div class=\"bigPrompt\">Reconocer una función metodológica</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Material de trabajo", "stage": "Fuente 1 · p. 159", "desc": "Reconocer una función metodológica.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 159 · pantalla 2/2", "page": "p. 159", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">159</span>\n    <div class=\"paperText\"><p>Entonces vio un san Cristóbal que tenía la boca abierta y le dijo:</p><p>— —Ah, ¿conque a ti te interesa? Bueno, pues aquí te dejo la cabra. Y ató la cabra a un confesionario. El cura salió y lo sacó de la iglesia para que no armara más jaleo. Pero Juan, desde la puerta, le gritó:</p><p>— —¡El jueves sin falta estoy aquí por el dinero!</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Material de trabajo</h3>\n    <p>La tabla y los fragmentos del cuento documentan el material usado en la implementación. Son esenciales para reproducir o comprender el estudio, pero no para responder mi pregunta conceptual actual.</p>\n    <div class=\"bigPrompt\">Reconocer una función metodológica</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Material de trabajo", "stage": "Fuente 1 · p. 160", "desc": "Seguir el ejemplo sin convertirlo en teoría.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 160 · pantalla 1/2", "page": "p. 160", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">160</span>\n    <div class=\"paperText compact\"><p>Frag­ mento Texto</p><p>Volvió Juan y le dijo a su madre:</p><p>— —La cabra ya está vendida. Pero como el hombre estaba tan ocupado, he que­</p><p>dado en volver el jueves. Llegó el jueves y Juan se presentó otra vez en la iglesia. Se fue derechito al san Cristóbal y le dijo:</p><p>— —Vengo a que me pagues la cabra. Y como no decía ni pío, le gritó más fuerte:</p><p>— —¡He dicho que me pagues la cabra! —Y nada. Y así unas cuantas veces.</p><p>Como san Cristóbal no respondía, le dio un empujón y la imagen se rompió. De dentro salieron muchas monedas. Al ruido acudió gritando el sacristán:</p><p>— —¡Ese dinero es mío! ¡Ese dinero es mío! Pero Juan ya había echado a correr. El sacristán no quiso perseguirlo para que no se supiera que él quitaba dinero de los cepillos de la iglesia y lo guardaba en el san Cristóbal.</p><p>Cuando vio tanto dinero, la madre de Juan pensó que no era tan tonto.</p><p>— —Mira, hijo mío, ahora vas a ir a vender esta olla de miel.</p><p>— —Bueno, madre. Y allá que va Juan con su olla de miel. Llegó hasta la plaza y se puso a pregonar:</p><p>— —¿Quién quiere miel? ¿Quién quiere miel? Rápidamente acudieron las moscas.</p><p>160 160</p><p>— —¡Tranquilas, que hay para todas! —dijo Juan. Y se puso a repartir la miel—.</p><p>¡Venid mosquitas, que está muy rica! ¡Venid, mosquitas, que está muy rica! La olla se quedó limpia como el cristal, y las moscas, de gordas, parecían moscardones.</p><p>— —Bueno, pues juntáis el dinero, y el jueves que viene, a esta misma hora, os</p><p>quiero aquí con él.</p><p>Su madre le preguntó qué había hecho con la miel:</p><p>— —La miel ya está vendida. Pero como eran tantas, no se ponían de acuerdo a</p><p>cuánto tocaba cada una. El jueves volvió a la plaza y no acudió ni una sola mosca.</p><p>Entonces Juan fue al ayuntamiento a protestar. El alcalde se lo tomó a guasa:</p><p>— —Mira, Juan, eso no es competencia mía. Eso es cosa del juez. Yo mismo te</p><p>acompañaré. Fueron a ver al juez y este siguió la broma: — —Mira, Juan, a las moscas no se les puede cobrar, pero te doy permiso para</p><p>que les des con el garrote a todas las que veas.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Material de trabajo</h3>\n    <p>Continúa el texto utilizado en la experiencia. No lo descarto porque sea irrelevante: cumple una función de transparencia metodológica. Simplemente no es una fuente de definición teórica para mi apartado.</p>\n    <div class=\"bigPrompt\">Seguir el ejemplo sin convertirlo en teoría</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Material de trabajo", "stage": "Fuente 1 · p. 160", "desc": "Seguir el ejemplo sin convertirlo en teoría.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 160 · pantalla 2/2", "page": "p. 160", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">160</span>\n    <div class=\"paperText\"><p>En ese momento se posó una mosca en la cabeza del juez y otra en la del alcalde, y Juan, tal como le habían dicho, le pegó un garrotazo a cada una. Lo que pasó, ya os lo podéis figurar.</p><p>Y colorín colorado, este tontísimo cuento se ha acabado.</p><p>2.3.1 Antes de la lectura empezaríamos estableciendo el propósito de lectura, activaríamos conocimientos previos y formularíamos hipótesis (predicciones) sobre lo que podría ocurrir en el relato que vamos a leer.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Material de trabajo</h3>\n    <p>Continúa el texto utilizado en la experiencia. No lo descarto porque sea irrelevante: cumple una función de transparencia metodológica. Simplemente no es una fuente de definición teórica para mi apartado.</p>\n    <div class=\"bigPrompt\">Seguir el ejemplo sin convertirlo en teoría</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Antes de la lectura", "stage": "Fuente 1 · p. 161", "desc": "Observar cómo se concreta la mediación.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 161 · pantalla 1/2", "page": "p. 161", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">161</span>\n    <div class=\"paperText compact\"><p>En esta situación, debe ser el docente quien establezca el propósito de lectura, haciendo visible la estrategia (modelado):</p><p>Vamos a leer un cuento y vamos a leerlo para divertirnos, vamos a disfrutar leyendo. ¿Recordáis que ayer estuvimos leyendo para aprender los días de la semana? Pues hoy vamos a leer para disfrutar con lo que le pasa a los personajes de este cuento.</p><p>Para la activación de conocimientos previos utilizaremos la portada (nombrando expresamente esta palabra) y sus elementos: título e imagen.</p><p>Mirad el cuento. Todos los cuentos tienen un título. ¿Dónde está el título? (se lee señalando cada palabra):«El tonto de mi pueblo». ¿Qué hace una persona tonta? En esta clase no hay personas tontas, pero a veces nos comportamos como tontos. ¿Sabéis cuándo me comporté yo como si fuera tonta? Cuando me peleé con mi hermana por una muñeca y la rompimos. Hicimos una tontería. ¿Alguno de vosotros se ha comportado últimamen­ te como un tonto, alguno se atrevería a decir alguna tontería que haya hecho? [...]. Sé que los cuentos empezaban y terminaban de una manera especial, pero ahora mismo no recuerdo ninguna fórmula para empezar el cuento…, si me ayudarais…</p><p>La activación de conocimientos previos debe estar relacionada, lógicamente, con contenidos temáticos, pero también con conocimientos de la estructura del cuento (de ahí la lectura del título o la indagación sobre fórmulas iniciales y finales).</p><p>161 161</p><p>La formulación de hipótesis antes de leer se basa también en el título y, sobre todo, en la ilustración que se refleje en la portada. El docente formula preguntas que ayudan a imaginar lo que puede suceder en el cuento (cuestionamiento):</p><p>¿De qué puede tratar un cuento que se titula «El tonto de mi pueblo»? ¿Dónde creéis que vivirá? ¿Tendrá familia? ¿Será rico o pobre? ¿Sabríais decirme, mirando los dibujos que hay en esta portada, alguna palabra que pudiera aparecer en el cuento?</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Antes de la lectura</h3>\n    <p>Aquí aparecen decisiones del docente antes de leer: propósito, predicción, conocimientos previos. Esto puede ayudarme a caracterizar la mediación, pero lo leo selectivamente porque mi concepto ya tiene una base.</p>\n    <div class=\"bigPrompt\">Observar cómo se concreta la mediación</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Antes de la lectura", "stage": "Fuente 1 · p. 161", "desc": "Observar cómo se concreta la mediación.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 161 · pantalla 2/2", "page": "p. 161", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">161</span>\n    <div class=\"paperText\"><p>Todas las respuestas obtenidas serían válidas, pero el docente ad­ quiere aquí un papel protagonista para el modelado si nombra la estrategia y verbaliza la operación mental que se está realizando con a) frases o sentencias que adviertan de la necesidad de la lectura para comprobar nuestras expec­ tativas; b) frases o sentencias que informen al niño de que están haciendo una predicción o formulando una hipótesis. Por ejemplo:</p><p>- es muy posible, lo comprobaremos con la lectura. - tal vez tengas razón, al leer lo comprobaremos. - me gusta la hipótesis que acabas de formular, pero tendremos que leer para saber si sucedió así. - cuando leamos, comprobaremos si se cumple lo que has dicho.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Antes de la lectura</h3>\n    <p>Aquí aparecen decisiones del docente antes de leer: propósito, predicción, conocimientos previos. Esto puede ayudarme a caracterizar la mediación, pero lo leo selectivamente porque mi concepto ya tiene una base.</p>\n    <div class=\"bigPrompt\">Observar cómo se concreta la mediación</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Interacciones modeladas", "stage": "Fuente 1 · p. 162", "desc": "Ver prácticas concretas.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 162 · pantalla 1/2", "page": "p. 162", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">162</span>\n    <div class=\"paperText compact\"><p>- muy buena predicción, me gusta. - has formulado una muy buena hipótesis. - ¿habéis oído lo que ha dicho Luis? Es una buena hipótesis según este dibujo.</p><p>Al mismo tiempo, se escriben (en el encerado, en post-its…) pa­ labras o expresiones que resuman las predicciones formuladas. A posteriori, facilitaremos la comprobación de hipótesis y combinaremos los procesos de lectura y escritura, atestiguando mediante el lenguaje escrito sus ideas.</p><p>2.3.2 Durante la lectura del cuento también se pueden hacer pre­ dicciones parciales, pero será el momento de realizar inferencias y de com­ probar la comprensión para poder tomar decisiones adecuadas ante errores o fallos en la misma. Iremos recorriendo el texto del cuento e indicando qué estrategias podríamos iniciar y en qué punto.</p><p>En el fragmento 1, cuando la madre toma la palabra, podemos aplicar dos estrategias: una inferencia de tipo local si les preguntamos ¿Quién dice estas palabras a Juan?, y un momento en el que el docente debe mostrar cómo hay que comprobar que estamos comprendiendo, deteniéndose ante alguna expresión desconocida y verbalizando la estrategia (modelado):</p><p>162 162</p><p>No entiendo muy bien qué quiere decir la madre con «antes de que le metamos mano» ni tampoco con «ponte a pregonarlo» ¿Alguien me puede ayudar? ¿Se os ocurre a qué se refiere? Porque cuando leemos y no enten­ demos algo, hay que tratar de resolverlo antes de seguir leyendo.</p><p>Las respuestas de los niños (introspección) harán que el docente muestre su acuerdo (Sí, estoy de acuerdo. Creo que puede significar…) o explique su significado, recogiendo las aportaciones de los niños para devol­ verles una solución construida y coherente:</p><p>Ah…, bien, entonces ahora ya lo entendemos: que antes de que les entrara hambre y se lo comieran era mejor venderlo y anunciarlo en voz alta por el pueblo.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Interacciones modeladas</h3>\n    <p>Los ejemplos muestran el discurso docente en acción. Son útiles para visualizar qué significa mediar, pero no necesito convertir cada intervención en una cita. Busco regularidades, no coleccionar ejemplos.</p>\n    <div class=\"bigPrompt\">Ver prácticas concretas</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Interacciones modeladas", "stage": "Fuente 1 · p. 162", "desc": "Ver prácticas concretas.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 162 · pantalla 2/2", "page": "p. 162", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">162</span>\n    <div class=\"paperText\"><p>Como sabemos que en el cuento Juan va a tener que vender otras dos cosas (triple repetición), podemos tomar la decisión de seguir leyendo para entender qué es eso de «ponte a pregonarlo», pero siempre haciendo visible ante los niños la operación mental que estamos realizando:</p><p>¿Alguien sabe cómo pregonar un jamón? Yo no sé bien cómo se hace esto [esperamos que los niños tampoco]. Seguiremos leyendo, porque es posible que nos lo digan más adelante.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Interacciones modeladas</h3>\n    <p>Los ejemplos muestran el discurso docente en acción. Son útiles para visualizar qué significa mediar, pero no necesito convertir cada intervención en una cita. Busco regularidades, no coleccionar ejemplos.</p>\n    <div class=\"bigPrompt\">Ver prácticas concretas</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Durante la lectura", "stage": "Fuente 1 · p. 163", "desc": "Identificar patrones.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 163 · pantalla 1/1", "page": "p. 163", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">163</span>\n    <div class=\"paperText compact\"><p>En el fragmento 2, cuando los perros comienzan a saltar alrede­ dor de Juan al olor del jamón, podemos provocar una inferencia: ¿Por qué saltaban los perros alrededor de Juan? ¿Qué querían realmente los perros? Su previsible respuesta habrá que unirla a la intervención de Juan en ese fragmento (—Conque queréis el jamón…) para nombrar la estrategia que los niños han conseguido poner en marcha:</p><p>Muy bien, habéis deducido por qué saltaban.</p><p>En este fragmento podemos hacer una hipótesis parcial impor­ tante porque se va a repetir tres veces: cuando Juan, interpretando mal los saltos y ladridos de los perros decide «venderles» el jamón y pasar al jueves siguiente a cobrarlo:</p><p>¿Creéis que los perros se lo pagarán? […] Estoy de acuerdo con vosotros: los perros no tienen dinero, no van a poder pagarlo. Es un disparate intentar que un perro te compre algo. Pero fijaos en lo que os pregunto: ¿creéis que alguien le pagará el jamón a Juan?</p><p>Ante sus respuestas, el docente debe ejercer el mismo modelado que describimos para la formulación de hipótesis antes de leer, teniendo en cuenta, además, que hay que utilizar la palabra disparate o tontería, que justificará el título del cuento.</p><p>163 163</p><p>En el fragmento 4 encontramos otro momento propicio para com­ probar la comprensión cuando Juan se acerca al primer cortijo y el perro empieza a ladrar:</p><p>A ver si lo he entendido bien: Juan cree que el perro le ladraba porque no quería pagarle. ¿Estaba en lo cierto o estaba equivocado? ¿Los perros ladran a las personas para indicarles que no quieren pagarles? […] Entonces nosotros lo estamos entendiendo bien y Juan lo estaba entendiendo mal.</p><p>Y cuando aparece el amo, podemos establecer una inferencia:</p><p>¿Quién es el amo?</p><p>Si los niños responden bien:</p><p>Vamos a continuar leyendo a ver si habéis acertado.</p><p>Si los niños no responden o responden mal:</p><p>Vamos a continuar leyendo a ver si lo averiguamos. Fijaos: Juan dice SU perro. Si dice SU perro, yo creo que es que el AMO, el DUEÑO del perro [modelado].</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Durante la lectura</h3>\n    <p>El artículo muestra estrategias durante la lectura. Aquí puedo reconocer cómo las preguntas y la conversación sostienen la participación. Me sirve como ejemplificación de una idea, no como una nueva definición.</p>\n    <div class=\"bigPrompt\">Identificar patrones</div>\n    "}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Durante la lectura", "stage": "Fuente 1 · p. 164", "desc": "Evitar la acumulación.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 164 · pantalla 1/2", "page": "p. 164", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">164</span>\n    <div class=\"paperText compact\"><p>En el fragmento 6 se repite de nuevo la misma acción, con una ligera variante, cuando su madre le encarga vender una cabrita, momento en el que se puede pedir a los educandos que realicen una predicción acerca de si logrará o no vender la cabra. Además, en este caso, el texto muestra cómo pregona Juan la cabra, con lo que podemos recuperar la estrategia de com­ probar la comprensión que habíamos dejado en suspenso unas líneas antes:</p><p>Cuando Juan va gritando «¿Quién me compra esta cabrita? ¿Quién me compra esta cabrita?», está pregonando la cabrita para que la gente se la quiera comprar. Ahora entiendo cómo se pregona el jamón de antes. ¿Cómo pregonaríais el jamón, entonces?</p><p>Hemos comprobado que niños de 4 y 5 años sí son capaces, en ese momento, de hacer la inferencia y exclamar «¿Quién me compra este jamón?».</p><p>Otra inferencia que se necesitaría establecer para poder comprender el cuento está en el fragmento 8, cuando se nombra a san Cristóbal. Por eso, les preguntaríamos:</p><p>¿Qué es un san Cristóbal? ¿Es una persona?</p><p>a) Si los niños responden bien:</p><p>164 164</p><p>Muy bien, es una de esas figuras que hay en las iglesias. Lo habéis averi­ guado porque lo habéis sabido relacionar con la palabra «iglesia», porque, efectivamente, en las iglesias hay figuras de santos [introspección].</p><p>b) Si no lo saben:</p><p>A ver, acabamos de decir que Juan se metió con la cabra en una iglesia. ¿Habéis estado alguna vez en una iglesia? ¿Qué cosas hay en una iglesia?</p><p>Estamos, en este segundo caso, realizando un proceso de andamiaje en el que se dan pistas y se formulan nuevas preguntas que ayuden a construir la inferencia. La inferencia anterior se debería unir a la expresión siguiente de la misma página, que confirma las características de una estatua como objeto que no puede ni hablar, ni comprar ni pagar:</p><p>¿Qué significa que no decía ni pío? ¿Por qué no decía ni pío? […] Porque el san Cristóbal es una estatua. Habéis sabido relacionar muy bien lo que sabéis con lo que dice el cuento [introspección].</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Durante la lectura</h3>\n    <p>La secuencia continúa con ejemplos muy específicos. Si mi marco se llenara de todos ellos, perdería jerarquía. Comprendo el patrón y avanzo.</p>\n    <div class=\"bigPrompt\">Evitar la acumulación</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Durante la lectura", "stage": "Fuente 1 · p. 164", "desc": "Evitar la acumulación.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 164 · pantalla 2/2", "page": "p. 164", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">164</span>\n    <div class=\"paperText\"><p>En el fragmento 9, la estatua de San Cristóbal se rompe y se des­ cubren las monedas que tenía dentro. El docente puede adelantar el motivo por el que Juan sí va a cobrar la cabrita, aunque haya cometido otro disparate intentando vender el animal a una estatua:</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Durante la lectura</h3>\n    <p>La secuencia continúa con ejemplos muy específicos. Si mi marco se llenara de todos ellos, perdería jerarquía. Comprendo el patrón y avanzo.</p>\n    <div class=\"bigPrompt\">Evitar la acumulación</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Durante la lectura", "stage": "Fuente 1 · p. 165", "desc": "Seleccionar evidencias representativas.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 165 · pantalla 1/2", "page": "p. 165", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">165</span>\n    <div class=\"paperText compact\"><p>Me acabo de dar cuenta de que si la estatua de san Cristóbal tenía mu­ chas monedas dentro, Juan sí va a poder cobrar la cabra. ¿Vosotros estáis entendiendo lo mismo que yo? [introspección].</p><p>En el mismo fragmento aparece la palabra sacristán, de significado probablemente desconocido para el alumnado de Educación Infantil, por lo que podemos mostrar la necesidad de parar para comprobar que estamos comprendiendo:</p><p>Un momento, aquí hay una palabra cuyo significado no conozco bien, y si no sé lo que significa, no podré seguir comprendiendo lo que leo. ¿Alguien me puede ayudar?, ¿alguien sabe qué significa «sacristán»? [introspección]. Aparece en la iglesia, así que debe de ser algo parecido a un cura… [andamiaje].</p><p>En el fragmento 10 se inicia la tercera venta, una olla de miel, y podemos plantear una predicción parcial cuando Juan está pregonando la miel, que, además, sirve para contextualizar una frase hecha:</p><p>¿A qué animales les gusta mucho la miel? [Suelen decir «a los osos», y hay que contraargumentar: Tenéis toda la razón, les encanta, pero los osos no suelen vivir dentro de un pueblo]. Si alguno dice «a las moscas», se lo confirmamos: Efectivamente, estoy de acuerdo contigo, de hecho se dice «acuden como moscas a la miel». Si no lo dicen, podemos utilizar esa frase hecha como pista de andamiaje: ¿No habéis oído nunca que acuden como… a la miel?</p><p>165 165</p><p>Por fin, en la última página podemos plantear la realización de dos inferencias encadenadas:</p><p>-una, en el momento del garrotazo a las moscas:</p><p>Cuando Juan le pegó un garrotazo a la mosca que estaba en la cabeza del alcalde, ¿quién recibió el garrotazo? […] Y cuando le dio el garrotazo a la mosca que estaba en la cabeza del juez, ¿quién recibiría el golpe?</p><p>-otra, la consecuencia de estas acciones que hasta el mismo cuen­ to deja a la deducción —dirigida, eso sí, por lo sucedido en las dos ventas anteriores de Juan— de los receptores cuando dice «lo que pasó ya os lo podéis figurar»:</p><p>¿Qué pasaría, qué os podéis figurar que pasó?</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Durante la lectura</h3>\n    <p>Esta parte vuelve a mostrar inferencias, verbalización y conversación. Puedo conservar un ejemplo si necesito ilustrar, pero no necesito extraer cada caso.</p>\n    <div class=\"bigPrompt\">Seleccionar evidencias representativas</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Durante la lectura", "stage": "Fuente 1 · p. 165", "desc": "Seleccionar evidencias representativas.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 165 · pantalla 2/2", "page": "p. 165", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">165</span>\n    <div class=\"paperText\"><p>Si las respuestas se dispersan, habría que redirigir la comprensión:</p><p>¿Cobraría Juan, finalmente, la miel?</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Durante la lectura</h3>\n    <p>Esta parte vuelve a mostrar inferencias, verbalización y conversación. Puedo conservar un ejemplo si necesito ilustrar, pero no necesito extraer cada caso.</p>\n    <div class=\"bigPrompt\">Seleccionar evidencias representativas</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 1", "phase": "Fuente 1", "title": "Después de la lectura", "stage": "Fuente 1 · p. 166", "desc": "Completar la secuencia.", "left": "Fuente 1 · texto completo por pantallas", "meta": "Página publicada 166 · pantalla 1/2", "page": "p. 166", "text": "<div class=\"paperTop\">Lectura compartida y estrategias de comprensión lectora en educación infantil</div>\n    <span class=\"pnum\">166</span>\n    <div class=\"paperText\"><p>2.3.3 Después de la lectura del cuento, la estrategia más usada es la recapitulación o resumen del cuento, que podemos poner en marcha de distinta manera:</p><p>a) Una es marcar la estructura de todo relato:</p><p>Vamos a recordar lo que pasó en este tontísimo cuento. ¿Cómo empezó todo? […] ¿Qué pasó luego? […] ¿Y cómo acabó?</p><p>b) Otra manera es ordenar secuencias de imágenes: se les propor­ cionan entre cuatro y ocho imágenes significativas del cu
