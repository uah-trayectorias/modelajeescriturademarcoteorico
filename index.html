 se presenta un ejemplo de uso</p><p>Imaginar estrategias diversas para resolver problemas a través del lenguaje</p><p>El niño identificaba las situaciones que vivían los personajes y proponía diversas estrategias para resolver las situaciones problema. Por ejemplo, el adulto en “Mientras se enfría el pastel” pregunta ¿Qué pasaría si desaparece el pastel? Y el niño responde: pues podrían preparar otro, o quizás preparan otra comida y celebran, o alguno de los invitados trae otro”. Lo que permitió que el niño considerara diversas posibilidades.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo rápido</span></div></div>\n    <h3>Imaginación y creación</h3>\n    <p>Esta zona muestra efectos y producciones del niño. Es importante para la investigación de la autora, pero se aleja de la pregunta que me llevó a esta fuente.</p>\n    <div class=\"bigPrompt\">Entender el alcance del estudio</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Ejemplos de historias", "stage": "Fuente 2 · p. 13", "desc": "Usar ejemplos para comprender, no acumular.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 13 · pantalla 1/2", "page": "p. 13", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">13</span>\n    <div class=\"paperText compact\"><p>del lenguaje dialógico en la creación de una de las historias. Tabla 6. Ejemplo de uso del lenguaje dialógico en la creación de historias “El dinosaurio que salva a los demás”</p><p>Lenguaje dialógico Ejemplo de dibujo creado en la historia Niño: me gustaría hacer una historia de un dinosaurio. Adulto: un dinosaurio que podría tener algún poder especial. Niño: invisibilidad, también fuerza, mover volcanes. Adulto: cómo te imaginas al dinosaurio. Niño: imagino que es grande, tiene espinas en la cabeza y dentro de su cuerpo para los poderes que tiene. Adulto: y dónde vivía el dinosaurio. Niño: en un bosque.</p><p>Este dinosaurio tiene el poder de la invisibilidad por eso lo dibujé verde para que no lo puedan ver los animales voladores. Él también tiene mucha fuerza para ayudar a levantar cosas muy pesadas.</p><p>Historia creada</p><p>Un dinosaurio estaba en el bosque con su hermano mayor, con su papá y su mamá. El dinosaurio se fue a caminar despacito porque estaba triste, muy triste. El dinosaurio jugaba y caminaba, caminaba y jugaba. De repente, un gran oso le preguntó: ¿Estás perdido? ¿Te gustaría jugar conmigo? El dinosaurio fue con el oso a su casa. En su casa después de tanto jugar se quedaron dormidos los dos. Ya estaba más tarde y dinosaurio se despertó, sintió calor y empezó a soplar, en ese momento todo empezó a volar en la casa de oso. –Oso se despertó y dijo: ¿Qué haces? –Solo soplo porque siento calor en mis patas. –¡Aja! Pero mira que tienes unos poderes extraños, te escucho pero no veo donde estás – dijo el oso. –Pues es que a veces puedo hacerme invisible. En ese momento llegó un león-gorila gruñón que quería comérselos a todos. El dinosaurio usó sus superpoderes y no dejó que se comiera a nadie. El león se puso a llorar y pidió perdón. Entonces los papás de dinosaurio llegaron y los invitaron a todos a cenar, después comieron dulces de chocolate y luego se deslizaron con otros animales del bosque.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Ejemplos de historias</h3>\n    <p>Los ejemplos concretan el análisis. Me ayudan a entender cómo se manifiesta el lenguaje dialógico, aunque no necesariamente debo citarlos en mi apartado.</p>\n    <div class=\"bigPrompt\">Usar ejemplos para comprender, no acumular</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Ejemplos de historias", "stage": "Fuente 2 · p. 13", "desc": "Usar ejemplos para comprender, no acumular.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 13 · pantalla 2/2", "page": "p. 13", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">13</span>\n    <div class=\"paperText\"><p>Este dino también se transforma cada vez que sopla y resopla. Él puede hacer que se muevan los volcanes y que caigan goticas de nieve para que se puedan usar troncos de árboles y ayuden a deslizar a los animales divirtiéndose. Cuando está muy enojado se genera una tormenta que puede inundar cualquier lugar.</p><p>*Fuente: Elaboración propia. En la tabla 7 se presenta un ejemplo de uso del lenguaje dialógico en la lectura compartida, en la creación de historias y en la identificación del impacto de la creación narrativa de la edad preescolar a la edad escolar.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Ejemplos de historias</h3>\n    <p>Los ejemplos concretan el análisis. Me ayudan a entender cómo se manifiesta el lenguaje dialógico, aunque no necesariamente debo citarlos en mi apartado.</p>\n    <div class=\"bigPrompt\">Usar ejemplos para comprender, no acumular</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Tabla de interacción", "stage": "Fuente 2 · p. 14", "desc": "Observar el fenómeno en acción.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 14 · pantalla 1/2", "page": "p. 14", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">14</span>\n    <div class=\"paperText\"><p>Tabla 7. Ejemplo de uso del lenguaje dialógico en las actividades de la investigación</p><p>Etapas Ejemplo uso lenguaje dialógico 1.Lectura compartida de cuentos tradicionales y libros álbum Niño: mira un gatito se subió a un árbol. Adulto: ¿Tú crees que está asustado? Niño: siii, muy asustado, tiene cara de susto, así mira (el niño realiza gestos y muestra cara de susto). Adulto: y ahora ¿qué crees que podría hacer este gatito para bajarse de ese árbol? Niño: quizás le pide ayuda a un pájaro gigante y con sus alitas lo monta encima y lo ayuda a bajar o quizás llega su mamá y lo ayuda a tranquilizar con un abrazo o quizás su amigo de allá abajo llama a algún adulto y él se sube y lo rescata.</p><p>2.Creación de historias conjuntas Adulto: que tal si iniciamos nuestra historia con un deseo. Niño: sí, me gustan los deseos. Yo deseo que llegue mi cumpleaños. ¿Cuánto falta para mi cumpleaños? Adulto: faltan dos días. Que tal si creamos una historia con tus deseos de cumpleaños. Niño: siiiii. Yo deseo que se cumplan mis deseos. Deseo un pastel de chocolate, también deseo que mis amigos vengan, deseo que una mascota llegue a mi casa el día de mi cumpleaños. Adulto: ¿qué tipo de mascota? Niño: me gustaría un perrito blanco cachorrito, es que son muy tiernos. Adulto: ¿y cuál podría ser el problema de la historia? Niño: que el perrito rompe todo. Adulto: ¿y qué más? Niño: que lloro un poquito, pero después el perrito aprende a no hacer desastres. 3.Identificación del impacto de la creación narrativa de la edad preescolar a la edad escolar</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Tabla de interacción</h3>\n    <p>La tabla permite ver intercambios adulto-niño. Es un buen lugar para visualizar la dialogicidad, pero sigo buscando la interpretación de mayor nivel que aparecerá en la discusión.</p>\n    <div class=\"bigPrompt\">Observar el fenómeno en acción</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Tabla de interacción", "stage": "Fuente 2 · p. 14", "desc": "Observar el fenómeno en acción.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 14 · pantalla 2/2", "page": "p. 14", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">14</span>\n    <div class=\"paperText\"><p>Niño: amo leer, también me gusta mucho crear historias. Yo imagino las historias en mi mente. Imagino las historias que me leen y también imagino las historias que me cuentan y también imagino las historias que yo creo. Me gusta dibujar mis historias. Adulto: ¿por qué te gustan tanto los cuentos? Niño: porque contigo aprendí muchas cosas nuevas con los cuentos que me leíste. Adulto: ¿por qué te gusta crear historias? Niño: porque con las historias que creo puedo inventar juegos y también con los juegos que invento puedo crear historias.</p><p>*Fuente: Elaboración propia. Discusión El objetivo de esta investigación fue analizar cómo surgió la conciencia narrativa en un niño en edad preescolar con el uso del lenguaje dialógico durante la lectura de cuentos y la creación de nuevas historias. Asimismo, se analizó el desarrollo de las habilidades de imaginación en el niño durante la creación de historias. Finalmente se analizó el impacto de la creación de historias de la edad preescolar en la edad escolar en el aprendizaje alfabético inicial. La conciencia narrativa surgió en la interacción entre el adulto y el niño usando libros de literatura infantil y conversaciones enriquecidas con el uso del lenguaje. Este desarrollo narrativo permitió aclarar pensamientos, sentimientos, acciones, hablar sobre el lenguaje, expresarse de forma oral y escrita (dibujos</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Tabla de interacción</h3>\n    <p>La tabla permite ver intercambios adulto-niño. Es un buen lugar para visualizar la dialogicidad, pero sigo buscando la interpretación de mayor nivel que aparecerá en la discusión.</p>\n    <div class=\"bigPrompt\">Observar el fenómeno en acción</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Resultados integrados", "stage": "Fuente 2 · p. 15", "desc": "Acercarme a la discusión.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 15 · pantalla 1/1", "page": "p. 15", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">15</span>\n    <div class=\"paperText compact\"><p>y palabras) usando secuencias de acciones, tomando un punto de vista propio, generando nuevos sentidos y significados, negociando significados, compartiendo el mundo mental, cambiando la forma de ver la experiencia propia, planificando acciones y situaciones desde diversas perspectivas e imaginando estrategias diversas para resolver problemas a través del lenguaje. Además, permitió la asociación de ideas entre los elementos donde una idea lleva a la otra estableciendo relaciones, la identificación de las acciones y aventuras de los personajes de manera organizada, así como por proponer un final en relación con el conflicto planteado en el inicio. En la intervención se analizaron las estrategias (animación, conversación-lenguaje dialógico, ejemplo) que utilizó el adulto para la identificación de la zona de desarrollo potencial del niño tanto en la lectura compartida de cuentos como en la creación de historias. En la lectura compartida fue importante la animación inicial porque el niño no había tenido la posibilidad de participar en actividades de este tipo antes de empezar esta investigación. Después de un mes de haber iniciado, el niño empezó a invitar a sus amigos del colegio a leer con él cuentos que lo cautivaban. Lo que quiere decir que esta actividad se transformó a la zona de desarrollo real. Por ejemplo, con “Silvestre y la piedrecita mágica”, el niño empezó a leer y releer sus imágenes y también las secuencias de acciones de manera independiente y, a involucrar a otros con él. Para la creación de historias fue necesario el ejemplo. Esto significa que el adulto iniciaba la historia con algunos indicios como “tengo un secreto…”, “un día se cumplió mi deseo de…” y proponía personajes y situaciones problemas. Después el niño empezó a proponer tanto inicios, como personajes, situaciones, problemas y formas de resolver los problemas. La estrategia sobresaliente (en la lectura compartida y en la creación de historias) fue el uso del lenguaje dialógico como medio simbólico para pensar y para hablar acerca de los cuentos leídos y de los cuentos creados. Esta se constituyó en una ayuda para que niño conociera la estructura (secuencias de acciones narrativas) y las funciones de los cuentos (social, cultural, estética) que leyó y de las historias que creó (experiencia emocional) conjuntamente con el adulto. El lenguaje dialógico en la interacción con el niño permitió mover las palabras y las imágenes hacia adelante tanto durante la lectura de cuentos como durante la creación paulatina de historias, de sus personajes y de situaciones imaginarias diversas así como lo propone Rodari (2006). Esto quiere decir que los cuentos no se desmoronaban sino que lograban avanzar apelando a los recuerdos y emociones de las historias que se compartían y que se creaban. La lectura repetida de cuentos posibilitó el desarrollo del uso social de lenguaje dialógico en su función de ayuda como medio externo para la planificación, la regulación, la anticipación y la verificación de las acciones del niño en la creación de historias. Por ejemplo, cuando el niño decía “yo quiero inventar un cuento de animalitos”, “me gustaría que los animalitos se pudieran combinar así como elefajirafa”, “si los animalitos se combinan entonces pueden tener super poderes para hacer todo lo que deseen en un lugar mágico”. Asimismo, esta lectura repetida de historias posibilitó que el niño se adueñara de las historias, que adoptara una propia postura de intercambio intersubjetivo, que construyera una representación del mundo que lo rodea, que se reconocieran mutuamente niño y adulto para trabajar conjuntamente así como lo propone Turin (2014). El niño se conmovía con los personajes de las historias, lo que le permitió transformar sus acciones. Ahora es más solidario con los niños de su colegio, se preocupa más por los niños que necesitan algo y siempre va a ayudarlos. Con esto se infiere que el contenido de los cuentos que se compartieron con el niño se configuró en acciones que el niño imaginaba y después se transformó en acciones reales. Otro hallazgo encontrado en esta investigación se refiere a que la lectura de literatura infantil se constituyó en la base de la ampliación de la experiencia narrativa para la creación de nuevas historias conjuntas entre el niño y el adulto. A su vez, estas experiencias permitieron expandir la imaginación del niño y sus habilidades perceptivas más allá de sus límites actuales así como lo propone Colomer (2005). La literatura infantil permitió que el niño descubriera que se pueden usar las palabras para describir el mundo externo y el mundo interno, también le permitió hablar sobre el lenguaje mismo (Colomer, 2009). En el aprendizaje de creación de historias el niño necesitó ayuda del adulto para analizar lenguaje. El lenguaje se convirtió entonces</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Aquí bajo la velocidad</span></div></div>\n    <h3>Resultados integrados</h3>\n    <p>El texto integra negociación de significados, puntos de vista y nuevos sentidos. Esta zona vuelve a acercarse mucho a mi construcción conceptual.</p>\n    <div class=\"bigPrompt\">Acercarme a la discusión</div>\n    "}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Discusión", "stage": "Fuente 2 · p. 16", "desc": "Relacionar teoría y práctica.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 16 · pantalla 1/2", "page": "p. 16", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">16</span>\n    <div class=\"paperText compact\"><p>en objeto de reflexión. Por ejemplo, “esa palabra es extraña”, “con estas palabras puedo mostrarte el camino para llegar”, “se me saltó un diente significa que el Ratoncito vendrá con un regalito”. Del mismo modo, otro hallazgo se refiere a que durante las interacciones conjuntas para la creación de historias el lenguaje dialógico se constituyó en un medio simbólico para descifrar al otro, sus intenciones (compartir experiencias). Es así como se puede afirmar que en cada interacción, los participantes (niño y adulto) expresaron intenciones y, de forma particular a través de la creación de personajes diversos el niño descubrió quién quiere y puede ser al identificar el sentido genuino de las relaciones humanas como lo plantea Reyes (2016). Por ejemplo, el niño expresaba con frecuencia que quería ser un buen amigo siempre para ayudar a los demás. Al mismo tiempo, con las historias creadas el niño transformó su interpretación del mundo al darle sentido y significado con el uso del lenguaje para imaginar diversas situaciones. Por ejemplo, cuando el niño utiliza expresiones como “me gustaría pintar el mundo con colores para que los niños de todos los lugares estén más alegres siempre”. Igualmente, otro hallazgo se refiere a que en cada historia creada las acciones se presentaron simplificadas y ordenadas en un esquema de inicio, desarrollo causal y conclusión, lo cual permitió que fuera asimilable para el niño así como lo expresa Colomer (2005). Además, el vínculo entre la implementación de estrategias que involucraban el uso de imágenes y la realización de preguntas fue útil porque se constituyó en medio externo para la organización de ideas y para la creación de nuevas historias. Para la creación de historias fue necesario imaginar situaciones diversas y recrearlas con palabras e imágenes gráficas. Las imágenes empleadas permitieron que el niño jugara con el lenguaje gráfico, eso le dio vida a las historias creadas con el lenguaje verbal. “La imaginación nos permitió ser otros y ser nosotros mismos, descubrir que podemos pensarnos, nombrarnos, soñarnos, encontrarnos, conmovernos y descifrarnos para otorgar sentido a la experiencia” (Reyes, 2016, p. 15).</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Aquí bajo la velocidad</span></div></div>\n    <h3>Discusión</h3>\n    <p>Aquí aparecen preguntas abiertas, ampliación de expresiones y modificación de intervenciones adultas. Esta sección concreta la mediación que ya había encontrado en la primera fuente.</p>\n    <div class=\"bigPrompt\">Relacionar teoría y práctica</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 1 de 2.</p></div><div class=\"action\"><b>Conexión con Fuente 1</b><p>Estas prácticas concretan la idea de ajustar la intervención adulta a las respuestas infantiles.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Discusión", "stage": "Fuente 2 · p. 16", "desc": "Relacionar teoría y práctica.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 16 · pantalla 2/2", "page": "p. 16", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">16</span>\n    <div class=\"paperText compact\"><p>Se resalta la calidad de las interacciones entre el niño y el adulto usando el lenguaje dialógico para el desarrollo narrativo (<span class=\"hl\">preguntas abiertas, añadir información, ampliar el contenido de lo que dice el niño</span>). Estas interacciones se caracterizaron por reforzar los intereses, la conversación y por extender las expresiones lingüísticas del niño. Del mismo modo, estas interacciones permitieron vincular emocionalmente al niño con el adulto y la historia leída o creada. En esta investigación, el niño usó el lenguaje dialógico para narrar y para pensar en narraciones y, <span class=\"underline\">el adulto modificaba sus intervenciones para maximizar la participación del niño</span>. Además, estas relaciones interactivas permitieron que el adulto identificara a través de preguntas lo que pensaba, sabía o creía el niño que iba a suceder. Asimismo, se identificó lo qué pensaba el niño acerca de lo que sintió el personaje de las historias leídas y de las historias creadas: valentía o necesidad de protección. Con la lectura de cuentos el niño logró reflexionar respecto a los estados emocionales de los personajes, lo cual se constituye en un aspecto esencial de su desarrollo psíquico. Por ejemplo, el niño decía “ese lobo se siente enojado, muy enojado porque tiene hambre y se cayó al río”. La creación de historias imaginarias en la edad preescolar repercutió así como lo propone Bruner (2007) en el significado que el niño le dio a la experiencia de aprendizaje de la lectura y la escritura en la edad escolar. Esto significa que el uso del lenguaje posibilitó que el niño pensara también de manera narrativa y que creara situaciones tanto de manera oral como a través de dibujos y de palabras escritas. Del mismo modo, en este estudio se identificó que las historias leídas y creadas contribuyeron al éxito en el aprendizaje alfabético del niño porque permitieron que él imaginara todo con palabras lejos de la situación contextual así como lo plantea Wells (1988). Esto se refleja en la creación de situaciones imaginarias diversas que se expresaron en historias escritas en la edad escolar. En la edad escolar se observó que el niño usa expresiones lingüísticas enriquecidas y secuencias de acciones. Lo que se explica porque el niño tenía muchas cosas que expresar tanto de manera oral como escrita. Además, el niño se convirtió en un lector motivado, lo que permitió que desarrollara habilidades para comprender e interpretar el sentido de los textos que leía y de las situaciones que vive día a día.</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Aquí bajo la velocidad</span></div></div>\n    <h3>Discusión</h3>\n    <p>Aquí aparecen preguntas abiertas, ampliación de expresiones y modificación de intervenciones adultas. Esta sección concreta la mediación que ya había encontrado en la primera fuente.</p>\n    <div class=\"bigPrompt\">Relacionar teoría y práctica</div>\n    <div class=\"call\"><b>Esta página ocupa 2 pantallas</b><p>Estoy recorriendo la misma página sin perder el contexto. Pantalla 2 de 2.</p></div><div class=\"action\"><b>Conexión con Fuente 1</b><p>Estas prácticas concretan la idea de ajustar la intervención adulta a las respuestas infantiles.</p></div>"}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Cierre de la discusión", "stage": "Fuente 2 · p. 17", "desc": "Extraer implicaciones sin sobregeneralizar.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 17 · pantalla 1/1", "page": "p. 17", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">17</span>\n    <div class=\"paperText compact\"><p>Se reflexiona acerca de que el itinerario de actividades generadas en esta investigación permitió que el niño transitara en nuevas posibilidades de comprensión del mundo y de disfrute de la vida a través de la creación de historias conjuntas usando el lenguaje dialógico. Por ejemplo, durante la creación de historias el niño retomó algunos personajes o situaciones de las historias leídas para analizar situaciones personales con las que se identificaba en diversos ámbitos (familiar, escolar, social). Se concluye que la creación de historias es posible gracias a la relación con el otro en la que cada uno propone un conjunto de diálogos permanentes de sentidos y significados. Esto quiere decir que la interacción es dinámica y sistémica lo que posibilita el despliegue de una compleja actividad psíquica de relaciones intersubjetivas y de negociación de significados. Asimismo, se concluye que la narración de cuentos se configura en una actividad útil para el desarrollo de las destrezas del lenguaje narrativo y fomenta el alfabetismo emergente en el niño así como lo propone Heppner (2016). Respecto a las limitaciones del estudio y, al mismo tiempo, a los retos para la investigación futura desde el punto de vista metodológico es conveniente considerar una población de niños más grande para robustecer los datos y los análisis. De este modo, estudios como este son relevantes en el ámbito educativo por su impacto en el desarrollo infantil y en los procesos de aprendizaje de los niños. El artículo original fue recibido el 25 de octubre de 2017 El artículo revisado fue recibido el 29 de octubre de 2018 El artículo fue aceptado el 30 de octubre de 2018</p></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">↘</div><div><b>Mientras leo, estoy pensando...</b><span>Leo con atención media</span></div></div>\n    <h3>Cierre de la discusión</h3>\n    <p>La autora interpreta el itinerario y sus posibilidades. Leo con atención, pero distingo entre lo que el estudio permite sostener y una definición general del concepto.</p>\n    <div class=\"bigPrompt\">Extraer implicaciones sin sobregeneralizar</div>\n    "}, {"route": "Fuente 2", "phase": "Fuente 2", "title": "Referencias", "stage": "Fuente 2 · p. 18", "desc": "Usar la bibliografía como red.", "left": "Fuente 2 · texto completo por pantallas", "meta": "Página 18 · pantalla 1/1", "page": "p. 18", "text": "<div class=\"paperTop\">Uso del lenguaje dialógico en la lectura compartida de literatura infantil</div>\n    <span class=\"pnum\">18</span>\n    <div class=\"paperText compact\"><p>Referencias Abraham, M. y Brenca, R. (2016). De los actos de habla a las destrezas narrativas. Argentina: Akadia Editorial. Aguirre, R. (2012). Pensamiento narrativo y educación. EDUCERE. 16 (53), p. 83-92. Applebee, A. (1978). The Child’s Concept of Story. The University Chicago Press. Bowyer-Crane, C., Snowling, M., Duff, F., Fieldsend, E., Carroll, J., Miles, J., Gotz, K., &amp; Hulme, C. (2008). Improving early language and literacy skills: Differential effects of an oral language versus a phonology with reading intervention. Child Psychology and Psychiatry, 49, 422-432. Bredikyte, M. (2010). Psychological Tools and the Development of Play. Cultural-historical Psychology, 4, 11- 18. Bredikyte, M. (2011). The zones of proximal development in children’s play. Oulu, Finland: Faculty of Education, University of Oulu. Bruner, J. (1984). Acción, pensamiento y lenguaje. Madrid: Alianza. Bruner, J. (1986). El habla del niño. Aprendiendo a usar el lenguaje. España: Ediciones Paidós. Bruner, J. (1988). Realidad mental y mundos posibles. España: Gedisa. Bruner, J. (2000). La educación puerta de la cultura. Barcelona: Gedisa. Bruner, J. (2007). Acción, pensamiento y lenguaje. Madrid: Alianza Editorial S.A. Bruner, J. (2008). Culture and Mind: Their Fruitful Incommensurability. Ethos, 36, 29-45. Colomer, T. (1997b). Cómo enseñan a leer los libros infantiles. En F.J. Cantero et al. (ed) Didáct struyendo...</b><span>Intertextualidad</span></div></div><h3>Los artículos no vienen relacionados: esa relación la construyo yo</h3><p>La segunda fuente amplía y especifica la interacción descrita por la primera.</p><div class=\"bigPrompt\">No pongo autores en fila: los hago dialogar alrededor de mi concepto.</div>"}, {"route": "Síntesis", "phase": "Construcción", "title": "¿Qué voy a entender por lectura compartida?", "stage": "Posición teórica", "desc": "Formulo una síntesis fundamentada a partir de ambas fuentes.", "left": "Síntesis teórica", "meta": "Mi interpretación fundamentada", "page": "Síntesis", "text": "<div class=\"paperTop\">LO QUE AHORA PUEDO SOSTENER</div><div class=\"paperText\"><p><span class=\"hl\">La lectura compartida puede comprenderse como una práctica dialógica y cooperativa en la que adulto y niños construyen significados alrededor de un texto.</span></p><p>Esta participación no ocurre de forma automática: requiere una mediación capaz de responder a las intervenciones infantiles, ampliar sus expresiones y generar oportunidades para interpretar, negociar significados y expresar comprensiones propias.</p><div class=\"marginNote\">Esta formulación no aparece completa en ninguno de los dos artículos. La construí relacionándolos.</div></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">∑</div><div><b>Mientras sintetizo, estoy tomando posición</b><span>Construcción teórica</span></div></div><h3>Ahora sí puedo decir qué significará el concepto en mi investigación</h3><p>Mi voz académica aparece en la selección, relación y síntesis de las fuentes.</p>"}, {"route": "Escritura", "phase": "Construcción", "title": "Ahora sí escribo", "stage": "De la lectura a la escritura", "desc": "El párrafo hace visible el proceso de lectura que ocurrió antes.", "left": "Párrafo del marco teórico", "meta": "Idea + Fuente 1 + Fuente 2 + elaboración", "page": "Redacción", "text": "<div class=\"paperTop\">PÁRRAFO EN CONSTRUCCIÓN</div><div class=\"paperText\"><p><span class=\"hl\">La lectura compartida puede comprenderse como una práctica dialógica y cooperativa que supera la lectura en voz alta centrada exclusivamente en la escucha.</span> Llamazares Prieto y Alonso-Cortés Fradejas (2016) la caracterizan como una situación en la que docente y niños cooperan e interactúan durante la lectura. <span class=\"hl2\">Esta dimensión puede profundizarse desde González-Moreno (2018), quien sitúa el lenguaje dialógico como un medio para negociar significados, interpretar la experiencia y expresar comprensiones propias.</span> <span class=\"underline\">Desde esta perspectiva, la participación infantil no surge de manera automática, sino que depende de una mediación adulta capaz de responder, ampliar y ajustar sus intervenciones para sostener la construcción conjunta de significado.</span></p><div class=\"marginNote\">Idea → Fuente 1 → relación con Fuente 2 → elaboración.</div></div>", "voice": "<div class=\"speaker\"><div class=\"avatar\">✎</div><div><b>Mientras escribo, vuelvo sobre todo el recorrido</b><span>Del objetivo al párrafo</span></div></div><h3>El párrafo es el final visible de muchas decisiones invisibles</h3><p>Pregunta → objetivos → conceptos → preguntas teóricas → búsqueda → lectura completa pero selectiva → discriminación → relación → síntesis → escritura.</p><div class=\"call\"><b>Lo más importante</b><p>No escribí “Autor A dice / Autor B dice”. Construí una idea y usé cada fuente para una función distinta.</p></div>"}];

function pertinenceOf(s){
  const k=inferSpeed(s);
  if(k==="focus") return "Alta para mi pregunta teórica";
  if(k==="scan") return "Indirecta: importante para el artículo, no central ahora";
  return "Media: necesito comprenderla, pero no necesariamente extraerla";
}
function decisionOf(s){
  const k=inferSpeed(s);
  if(k==="focus") return "Me detengo, relaciono y evalúo qué extraer";
  if(k==="scan") return "Reconozco su función y sigo";
  return "Comprendo la idea general y continúo";
}
function destinationFor(s){
  const t=(s.title+" "+s.desc+" "+s.voice).toLowerCase();
  if(t.includes("método")||t.includes("participantes")||t.includes("procedimiento")||t.includes("material")) return "Método / evaluación de la fuente";
  if(t.includes("resultado")) return "Estado del arte";
  if(t.includes("referencias")) return "Nueva búsqueda de fuentes";
  if(t.includes("estrategias de comprensión")) return "Otro subapartado del marco";
  return "";
}
function enrichVoice(s){
  if(s.phase!=="Fuente 1" && s.phase!=="Fuente 2") return s.voice;
  const sp=inferSpeed(s);
  const dest=destinationFor(s);
  const matrix=`<div class="speedBadge speed-${sp}"><span class="speedDot"></span>${speedLabel(sp)}</div>
  <div class="reasonMatrix">
    <div class="rm"><small>Función en el artículo</small><b>${functionOf(s)}</b></div>
    <div class="rm"><small>Pertinencia para mi pregunta</small><b>${pertinenceOf(s)}</b></div>
    <div class="rm"><small>Profundidad de lectura</small><b>${speedLabel(sp).split(" · ")[0]}</b></div>
    <div class="rm"><small>Mi decisión</small><b>${decisionOf(s)}</b></div>
  </div>`;
  const destBlock=dest?`<div class="destination"><b>No entra aquí, pero puede servir para...</b><p>${dest}</p></div>`:"";
  return s.voice + matrix + destBlock;
}

function render(){const s=steps[idx];document.getElementById('bar').style.width=((idx+1)/steps.length*100)+'%';document.getElementById('count').textContent=(idx+1)+' / '+steps.length;document.getElementById('left').textContent=s.left;document.getElementById('meta').textContent=s.meta;document.getElementById('pageState').textContent=s.page;document.getElementById('stage').textContent=s.stage;document.getElementById('title').textContent=s.title;document.getElementById('desc').textContent=s.desc;
    const rh=document.querySelector('.reasonHead');
    const old=rh.querySelector('.topSpeed'); if(old) old.remove();
    if(s.phase==='Fuente 1'||s.phase==='Fuente 2'){
      const sp=inferSpeed(s);
      const d=document.createElement('div');
      d.className='topSpeed';
      d.innerHTML='<i></i>'+speedLabel(sp);
      rh.appendChild(d);
    }const p=document.getElementById('page');p.className='page'+(s.transition?' transitionPage':'');p.innerHTML=s.text;document.getElementById('voice').innerHTML=enrichVoice(s);document.querySelector('.reasonBody').scrollTop=0;renderRoute()}
function next(){idx=Math.min(steps.length-1,idx+1);render()}function prev(){idx=Math.max(0,idx-1);render()}function go(n){idx=n;render()}
function toggleMarks(){marks=!marks;if(marks){render();return}document.querySelectorAll('.hl,.hl2,.underline').forEach(x=>{x.style.background='none';x.style.textDecoration='none'});document.querySelectorAll('.marginNote,.connector').forEach(x=>x.style.display='none')}
render();
</script></body></html>
